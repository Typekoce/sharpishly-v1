# /etc/nginx/sites-available/sharpishly.conf

upstream php_fpm_backend {
    server unix:/run/php/php8.4-fpm.sock max_fails=1 fail_timeout=5s;
    server unix:/run/php/php8.3-fpm.sock max_fails=1 fail_timeout=5s backup;
}

# 1. Existing Legacy/Thomasons Application Server Block
server {
    listen 80;

    server_name sharpishly.dev *.sharpishly.dev sharpishly.vm *.sharpishly.vm localhost 127.0.0.1;

    set $base_path /home/seaview/Documents/SHARPISHLY-THOMASONS;

    root $base_path/web/frontend;
    index index.html;

    access_log /var/log/nginx/sharpishly_access.log;
    error_log  /var/log/nginx/sharpishly_error.log warn;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(php|api)(/|$) {
        include fastcgi_params;
        fastcgi_pass php_fpm_backend;

        fastcgi_param SCRIPT_FILENAME $base_path/web/php/src/index.php;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param REQUEST_URI     $request_uri;

        fastcgi_read_timeout 600;
        fastcgi_send_timeout 600;
        fastcgi_buffering       off;
    }

    client_max_body_size 50M;
    client_body_buffer_size 1M;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}

# 2. New Sharpishly v2.0 Server Block
server {
    listen 80;

    server_name sharpishly2.test *.sharpishly2.test;

    set $v2_path /home/seaview/Documents/sharpishly;

    root $v2_path/public;
    index index.html;

    access_log /var/log/nginx/sharpishly2_access.log;
    error_log  /var/log/nginx/sharpishly2_error.log warn;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(php|api)(/|$) {
        include fastcgi_params;
        fastcgi_pass php_fpm_backend;

        fastcgi_param SCRIPT_FILENAME $v2_path/app/php/src/index.php;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param REQUEST_URI     $request_uri;

        fastcgi_read_timeout 600;
        fastcgi_send_timeout 600;
        fastcgi_buffering       off;
    }

    client_max_body_size 50M;
    client_body_buffer_size 1M;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}
