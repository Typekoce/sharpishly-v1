<div id="ai" class="home-card ai-container">
    <!-- Header -->
    <header class="home-cards ai-header">
        <div class="header-title">
            <h2>AI Assistant</h2>
            <span class="model-badge" id="model-badge">qwen2.5:0.5b</span>
        </div>
    </header>

    <!-- Message History Stream -->
    <div id="ai-chat-stream" class="home-records ai-chat-stream">
        <div class="chat-message assistant-message">
            <div class="avatar">AI</div>
            <div class="message-content">
                <p>Hello! Ask me anything, upload a file, or let me check your emails, stocks, or run calculations.</p>
            </div>
        </div>
    </div>

    <!-- Fixed Bottom Input Bar -->
    <footer class="ai-footer-fixed">
        <div class="ai-input-wrapper">
            <!-- Selected File Preview Pill -->
            <div id="ai-file-preview" class="ai-file-preview" style="display: none;">
                <span id="ai-file-name"></span>
                <button type="button" id="ai-file-clear" class="file-clear-btn" title="Remove file">&times;</button>
            </div>

            <form id="ai-prompt-form" class="prompt-form">
                <!-- Hidden File Input + Trigger Button -->
                <input type="file" id="ai-file-input" style="display: none;" />
                <button type="button" id="ai-upload-btn" class="upload-btn" title="Attach file" aria-label="Attach file">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>

                <textarea 
                    id="ai-prompt-input" 
                    class="prompt-input" 
                    placeholder="Ask anything or upload a file..." 
                    rows="1"
                    required
                ></textarea>

                <button type="submit" id="ai-send-btn" class="send-btn" title="Send prompt" aria-label="Send prompt">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </div>
    </footer>
</div>
