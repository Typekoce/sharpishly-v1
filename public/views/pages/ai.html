<div id="ai" class="home-card ai-container">
    <!-- Header Controls -->
    <header class="home-cards ai-header">
        <div class="header-title">
            <h2>AI Assistant</h2>
            <span class="model-badge">qwen2.5:0.5b</span>
        </div>
        <div class="tool-selector-group">
            <label for="tool-select" class="tool-label">Active Tool:</label>
            <select id="tool-select" class="tool-dropdown">
                <option value="calculator">Calculator MCP (/py/calculator/mcp)</option>
                <option value="gmail">Gmail MCP (/py/gmail/mcp)</option>
            </select>
        </div>
    </header>

    <!-- Message History Stream -->
    <div id="ai-chat-stream" class="home-records ai-chat-stream">
        <div class="chat-message assistant-message">
            <div class="avatar">AI</div>
            <div class="message-content">
                <p>Hello! I am connected to your local Qwen model and MCP servers. How can I help you today?</p>
            </div>
        </div>
    </div>

    <!-- Input Form Footer -->
    <footer class="quick-links ai-footer">
        <form id="ai-prompt-form" class="prompt-form">
            <textarea 
                id="ai-prompt-input" 
                class="prompt-input" 
                placeholder="Ask Qwen a question or request an MCP action..." 
                rows="1"
                required
            ></textarea>
            <button type="submit" id="ai-send-btn" class="send-btn">
                <span>Send</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </form>
    </footer>
</div>
