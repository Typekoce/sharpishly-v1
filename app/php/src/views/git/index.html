
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="Git Lens Workbench — zero-dependency visual Git history explorer" />
  <title>Git Lens Workbench</title>
  <style>
    @layer reset, tokens, base, layout, components, utilities, motion;

    @layer reset {
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { -webkit-text-size-adjust: 100%; }
      body { min-height: 100dvh; line-height: 1.5; }
      img, svg, canvas { display: block; max-width: 100%; }
      button, input, select, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; border: none; background: none; }
      a { color: inherit; text-decoration: none; }
      ul, ol { list-style: none; }
      dialog { border: none; padding: 0; background: transparent; }
      :focus { outline: none; }
      :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    }

    @layer tokens {
      :root {
        color-scheme: dark;
        --hue: 220;
        --bg: oklch(0.15 0.02 var(--hue));
        --bg-elevated: oklch(0.18 0.025 var(--hue));
        --surface: oklch(0.22 0.03 var(--hue));
        --surface-2: oklch(0.26 0.035 var(--hue));
        --border: oklch(0.30 0.03 var(--hue));
        --border-strong: oklch(0.38 0.04 var(--hue));
        --text: oklch(0.93 0.01 var(--hue));
        --text-muted: oklch(0.68 0.02 var(--hue));
        --text-faint: oklch(0.52 0.02 var(--hue));
        --accent: oklch(0.78 0.14 195);          /* electric cyan */
        --accent-hover: oklch(0.84 0.13 195);
        --accent-muted: oklch(0.42 0.08 195);
        --success: oklch(0.72 0.15 145);         /* branch green */
        --warning: oklch(0.78 0.14 85);
        --danger: oklch(0.65 0.18 25);
        --focus: oklch(0.78 0.14 195);
        --merge: oklch(0.75 0.14 310);           /* merge purple */

        --radius-sm: 6px;
        --radius: 10px;
        --radius-lg: 14px;
        --radius-xl: 20px;
        --shadow: 0 4px 20px oklch(0 0 0 / 0.4);
        --shadow-lg: 0 12px 40px oklch(0 0 0 / 0.5);
        --ring: 0 0 0 3px color-mix(in oklch, var(--accent) 35%, transparent);

        --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --font-mono: ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas, monospace;

        --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
        --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem;
        --space-8: 2rem; --space-10: 2.5rem; --space-12: 3rem; --space-16: 4rem;

        --text-xs: clamp(0.75rem, 0.7rem + 0.15vw, 0.8125rem);
        --text-sm: clamp(0.8125rem, 0.78rem + 0.15vw, 0.875rem);
        --text-base: clamp(0.9375rem, 0.9rem + 0.2vw, 1rem);
        --text-lg: clamp(1.05rem, 1rem + 0.3vw, 1.125rem);
        --text-xl: clamp(1.2rem, 1.1rem + 0.5vw, 1.35rem);
        --text-2xl: clamp(1.45rem, 1.25rem + 0.9vw, 1.7rem);
        --text-3xl: clamp(1.8rem, 1.5rem + 1.4vw, 2.2rem);
        --text-4xl: clamp(2.2rem, 1.7rem + 2vw, 2.9rem);

        --header-h: 3.4rem;
        --motion: 1;
      }

      [data-theme="light"] {
        color-scheme: light;
        --bg: oklch(0.97 0.01 220);
        --bg-elevated: oklch(1 0.005 220);
        --surface: oklch(0.99 0.008 220);
        --surface-2: oklch(0.94 0.015 220);
        --border: oklch(0.88 0.02 220);
        --border-strong: oklch(0.78 0.025 220);
        --text: oklch(0.22 0.02 220);
        --text-muted: oklch(0.42 0.02 220);
        --text-faint: oklch(0.55 0.02 220);
        --accent: oklch(0.55 0.14 210);
        --accent-hover: oklch(0.48 0.15 210);
        --focus: oklch(0.50 0.14 210);
        --shadow: 0 4px 16px oklch(0 0 0 / 0.08);
        --shadow-lg: 0 12px 40px oklch(0 0 0 / 0.12);
      }

      [data-motion="reduce"] { --motion: 0; }
      @media (prefers-reduced-motion: reduce) {
        :root:not([data-motion="full"]) { --motion: 0; }
      }
    }

    @layer base {
      body {
        font-family: var(--font-sans);
        font-size: var(--text-base);
        background: var(--bg);
        color: var(--text);
        overflow-x: hidden;
      }
      h1, h2, h3 { text-wrap: balance; line-height: 1.2; font-weight: 650; }
      p { text-wrap: pretty; }
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
      }
      .skip-link {
        position: absolute; top: -100%; left: var(--space-4); z-index: 1000;
        padding: var(--space-3) var(--space-5); background: var(--accent);
        color: oklch(0.15 0.02 195); border-radius: var(--radius); font-weight: 600;
      }
      .skip-link:focus { top: var(--space-3); }
      ::selection { background: color-mix(in oklch, var(--accent) 40%, transparent); }
      code, .mono { font-family: var(--font-mono); font-size: 0.9em; }
    }

    @layer layout {
      .app-shell { display: grid; grid-template-rows: auto 1fr; min-height: 100dvh; }
      .app-header {
        position: sticky; top: 0; z-index: 50; height: var(--header-h);
        display: flex; align-items: center; gap: var(--space-3);
        padding: 0 var(--space-4);
        background: color-mix(in oklch, var(--bg-elevated) 92%, transparent);
        backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
      }
      .brand {
        display: flex; align-items: center; gap: var(--space-2);
        font-weight: 700; font-size: var(--text-lg); letter-spacing: -0.02em; white-space: nowrap;
      }
      .brand svg { width: 26px; height: 26px; flex-shrink: 0; }
      .nav-main { display: none; gap: 2px; margin-left: var(--space-3); }
      @media (min-width: 768px) { .nav-main { display: flex; } }
      .nav-link {
        padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm);
        font-size: var(--text-sm); font-weight: 500; color: var(--text-muted);
        transition: background 0.15s, color 0.15s;
      }
      .nav-link:hover { color: var(--text); background: var(--surface); }
      .nav-link[aria-current="page"] {
        color: var(--accent); background: color-mix(in oklch, var(--accent) 14%, transparent);
      }
      .header-actions { margin-left: auto; display: flex; align-items: center; gap: var(--space-2); }
      .main-content { display: grid; grid-template-columns: 1fr; min-height: 0; }
      @media (min-width: 1100px) {
        .main-content.has-sidebar { grid-template-columns: 280px 1fr; }
      }
      .sidebar {
        display: none; flex-direction: column; gap: var(--space-4);
        padding: var(--space-5); border-right: 1px solid var(--border);
        background: var(--bg-elevated); overflow-y: auto;
      }
      @media (min-width: 1100px) {
        .main-content.has-sidebar .sidebar { display: flex; }
      }
      .content-area { padding: var(--space-5); overflow-y: auto; min-width: 0; }
      @media (min-width: 768px) { .content-area { padding: var(--space-6) var(--space-8); } }
      .page-header {
        display: flex; flex-wrap: wrap; align-items: flex-start;
        justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-6);
      }
      .page-title { font-size: var(--text-3xl); letter-spacing: -0.03em; }
      .page-desc { color: var(--text-muted); margin-top: var(--space-2); max-width: 50ch; }

      .mobile-nav {
        position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
        display: flex; justify-content: space-around;
        padding: var(--space-2) var(--space-2) calc(var(--space-2) + env(safe-area-inset-bottom));
        background: color-mix(in oklch, var(--bg-elevated) 94%, transparent);
        backdrop-filter: blur(12px); border-top: 1px solid var(--border);
      }
      @media (min-width: 768px) { .mobile-nav { display: none; } }
      .mobile-nav a {
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        padding: var(--space-2) var(--space-3); font-size: var(--text-xs);
        color: var(--text-muted); min-width: 64px; border-radius: var(--radius-sm);
      }
      .mobile-nav a[aria-current="page"] { color: var(--accent); }
      .mobile-nav svg { width: 20px; height: 20px; }
      body { padding-bottom: calc(4rem + env(safe-area-inset-bottom)); }
      @media (min-width: 768px) { body { padding-bottom: 0; } }
    }

    @layer components {
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
        padding: var(--space-2) var(--space-4); min-height: 38px; border-radius: var(--radius);
        font-size: var(--text-sm); font-weight: 600;
        transition: background 0.15s, color 0.15s, transform 0.1s; white-space: nowrap;
      }
      .btn:active { transform: scale(0.97); }
      .btn-primary { background: var(--accent); color: oklch(0.15 0.02 195); }
      .btn-primary:hover { background: var(--accent-hover); }
      .btn-secondary {
        background: var(--surface); border: 1px solid var(--border); color: var(--text);
      }
      .btn-secondary:hover { background: var(--surface-2); border-color: var(--border-strong); }
      .btn-ghost { color: var(--text-muted); }
      .btn-ghost:hover { color: var(--text); background: var(--surface); }
      .btn-icon { width: 38px; height: 38px; padding: 0; border-radius: var(--radius); }
      .btn-icon svg { width: 18px; height: 18px; }

      .card {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius-lg); overflow: hidden;
      }
      .card-body { padding: var(--space-4); }
      .card-header {
        display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
        padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border);
      }
      .card-title { font-size: var(--text-base); font-weight: 650; }

      .badge {
        display: inline-flex; align-items: center; gap: 4px;
        padding: 2px 8px; border-radius: 999px; font-size: var(--text-xs);
        font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
      }
      .badge-branch { background: color-mix(in oklch, var(--success) 18%, transparent); color: var(--success); }
      .badge-merge { background: color-mix(in oklch, var(--merge) 18%, transparent); color: var(--merge); }
      .badge-main { background: color-mix(in oklch, var(--accent) 18%, transparent); color: var(--accent); }

      .field { display: flex; flex-direction: column; gap: var(--space-2); }
      .field label { font-size: var(--text-sm); font-weight: 550; color: var(--text-muted); }
      .field input, .field select, .field textarea {
        width: 100%; padding: var(--space-2) var(--space-3);
        background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
        color: var(--text); transition: border-color 0.15s, box-shadow 0.15s;
      }
      .field input:focus, .field select:focus, .field textarea:focus {
        border-color: var(--accent); box-shadow: var(--ring);
      }

      .search-bar {
        display: flex; align-items: center; gap: var(--space-2);
        padding: var(--space-2) var(--space-3); background: var(--bg);
        border: 1px solid var(--border); border-radius: var(--radius); min-width: 0;
      }
      .search-bar input {
        flex: 1; min-width: 0; background: transparent; border: none;
        padding: var(--space-1) 0; color: var(--text);
      }
      .search-bar input::placeholder { color: var(--text-faint); }
      .search-bar svg { width: 16px; height: 16px; color: var(--text-faint); flex-shrink: 0; }

      .chip-group { display: flex; flex-wrap: wrap; gap: var(--space-2); }
      .chip {
        padding: 3px 10px; border-radius: 999px; font-size: var(--text-xs); font-weight: 550;
        background: var(--surface); border: 1px solid var(--border); color: var(--text-muted);
        transition: all 0.15s;
      }
      .chip:hover { border-color: var(--border-strong); color: var(--text); }
      .chip[aria-pressed="true"] {
        background: color-mix(in oklch, var(--accent) 16%, transparent);
        border-color: var(--accent); color: var(--accent);
      }

      /* Commit graph container */
      .graph-wrap {
        position: relative; background: var(--bg); border: 1px solid var(--border);
        border-radius: var(--radius-lg); overflow: auto; min-height: 420px;
        max-height: min(70dvh, 720px);
      }
      .graph-svg { display: block; min-width: 100%; }
      .graph-node { cursor: pointer; }
      .graph-node circle {
        transition: r 0.15s, stroke-width 0.15s;
      }
      .graph-node:hover circle, .graph-node[aria-selected="true"] circle {
        r: 9; stroke-width: 3;
      }
      .graph-label {
        font-family: var(--font-mono); font-size: 11px; fill: var(--text-muted);
        pointer-events: none;
      }
      .graph-msg {
        font-size: 12px; fill: var(--text); pointer-events: none;
      }

      /* Diff viewer */
      .diff-view {
        font-family: var(--font-mono); font-size: var(--text-xs);
        line-height: 1.55; overflow-x: auto; white-space: pre;
      }
      .diff-add { background: color-mix(in oklch, var(--success) 14%, transparent); color: var(--success); }
      .diff-del { background: color-mix(in oklch, var(--danger) 14%, transparent); color: var(--danger); }
      .diff-hunk { color: var(--accent); }

      /* Commit list */
      .commit-list { display: flex; flex-direction: column; gap: 2px; }
      .commit-row {
        display: grid; grid-template-columns: 18px 1fr auto; gap: var(--space-3);
        align-items: start; padding: var(--space-3); border-radius: var(--radius);
        cursor: pointer; transition: background 0.12s;
        container-type: inline-size; container-name: commit-row;
      }
      .commit-row:hover, .commit-row[aria-selected="true"] {
        background: var(--surface);
      }
      .commit-row .hash { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--accent); }
      .commit-row .msg { font-size: var(--text-sm); font-weight: 500; }
      .commit-row .meta { font-size: var(--text-xs); color: var(--text-faint); margin-top: 2px; }
      .lane-dot {
        width: 10px; height: 10px; border-radius: 50%; margin-top: 5px;
        box-shadow: 0 0 0 2px var(--bg);
      }

      /* Hero */
      .hero {
        position: relative; border-radius: var(--radius-xl); overflow: hidden;
        background: var(--surface); border: 1px solid var(--border); margin-bottom: var(--space-8);
      }
      .hero-visual { position: absolute; inset: 0; opacity: 0.5; pointer-events: none; }
      .hero-content { position: relative; padding: var(--space-10) var(--space-6); max-width: 40rem; }
      @media (min-width: 768px) { .hero-content { padding: var(--space-14) var(--space-10); } }
      .hero h1 { font-size: var(--text-4xl); letter-spacing: -0.04em; margin-bottom: var(--space-3); }
      .hero p { color: var(--text-muted); font-size: var(--text-lg); margin-bottom: var(--space-5); }
      .hero-actions { display: flex; flex-wrap: wrap; gap: var(--space-3); }

      .stats-row {
        display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3);
        margin-bottom: var(--space-8);
      }
      @media (min-width: 640px) { .stats-row { grid-template-columns: repeat(4, 1fr); } }
      .stat-card {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius-lg); padding: var(--space-4);
      }
      .stat-value { font-size: var(--text-2xl); font-weight: 700; font-variant-numeric: tabular-nums; }
      .stat-label { font-size: var(--text-sm); color: var(--text-muted); margin-top: 2px; }

      /* Dialog */
      dialog::backdrop { background: oklch(0.08 0.02 220 / 0.7); backdrop-filter: blur(4px); }
      .dialog-panel {
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl);
        box-shadow: var(--shadow-lg); width: min(94vw, 720px); max-height: min(88dvh, 860px);
        display: flex; flex-direction: column; overflow: hidden;
      }
      .dialog-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--border);
      }
      .dialog-body { padding: var(--space-5); overflow-y: auto; flex: 1; }
      .dialog-footer {
        display: flex; justify-content: flex-end; gap: var(--space-3);
        padding: var(--space-3) var(--space-5); border-top: 1px solid var(--border);
      }

      [popover] {
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg); padding: var(--space-3); margin: 0; inset: auto;
      }
      .cap-grid { display: grid; gap: var(--space-2); font-size: var(--text-xs); }
      .cap-item {
        display: grid; grid-template-columns: auto 1fr auto; gap: var(--space-2);
        align-items: center; padding: var(--space-2) var(--space-3);
        background: var(--bg); border-radius: var(--radius-sm);
      }
      .cap-dot { width: 8px; height: 8px; border-radius: 50%; }
      .cap-dot.on { background: var(--success); }
      .cap-dot.off { background: var(--text-faint); }
      .cap-name { font-weight: 550; }
      .cap-desc { color: var(--text-faint); grid-column: 2 / -1; font-size: 0.68rem; }

      .empty-state { text-align: center; padding: var(--space-12) var(--space-6); color: var(--text-muted); }
      .empty-state h3 { font-size: var(--text-xl); color: var(--text); margin-bottom: var(--space-2); }

      .toast-region {
        position: fixed; bottom: calc(5rem + env(safe-area-inset-bottom)); right: var(--space-4);
        z-index: 200; display: flex; flex-direction: column; gap: var(--space-2); pointer-events: none;
      }
      @media (min-width: 768px) { .toast-region { bottom: var(--space-6); } }
      .toast {
        pointer-events: auto; background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius); padding: var(--space-3) var(--space-4);
        box-shadow: var(--shadow); font-size: var(--text-sm); max-width: 300px;
        animation: toast-in 0.28s ease;
      }
      @keyframes toast-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .fav-btn { color: var(--text-faint); }
      .fav-btn[aria-pressed="true"] { color: var(--accent); }

      .file-list { display: flex; flex-direction: column; gap: 1px; }
      .file-row {
        display: flex; align-items: center; gap: var(--space-3);
        padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm);
        font-family: var(--font-mono); font-size: var(--text-sm); cursor: pointer;
      }
      .file-row:hover { background: var(--surface); }
      .file-row .status { width: 14px; text-align: center; font-weight: 700; }
      .file-row .status.A { color: var(--success); }
      .file-row .status.M { color: var(--warning); }
      .file-row .status.D { color: var(--danger); }
    }

    @layer utilities {
      .flex { display: flex; } .items-center { align-items: center; }
      .gap-2 { gap: var(--space-2); } .gap-3 { gap: var(--space-3); }
      .mt-2 { margin-top: var(--space-2); } .mb-4 { margin-bottom: var(--space-4); }
      .text-muted { color: var(--text-muted); } .text-sm { font-size: var(--text-sm); }
      .text-xs { font-size: var(--text-xs); } .mono { font-family: var(--font-mono); }
      .hidden { display: none !important; }
      .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    }

    @layer motion {
      @media (prefers-reduced-motion: no-preference) {
        :root:not([data-motion="reduce"]) {
          .btn, .nav-link, .chip, .commit-row { transition-duration: calc(0.15s * var(--motion)); }
        }
      }
      ::view-transition-old(root), ::view-transition-new(root) {
        animation-duration: calc(0.25s * var(--motion));
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="app-shell" id="app">
    <header class="app-header" role="banner">
      <a href="#/" class="brand" data-link>
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="8" cy="8" r="3" fill="var(--accent)"/>
          <circle cx="24" cy="8" r="3" fill="var(--success)"/>
          <circle cx="16" cy="24" r="3" fill="var(--merge)"/>
          <path d="M8 11v6c0 2 2 4 8 4s8-2 8-4v-6" stroke="var(--text-muted)" stroke-width="1.5" fill="none"/>
          <path d="M16 11v9" stroke="var(--text-muted)" stroke-width="1.5"/>
        </svg>
        <span>Git Lens</span>
      </a>
      <nav class="nav-main" aria-label="Primary">
        <a href="#/" class="nav-link" data-link data-route="/">Overview</a>
        <a href="#/graph" class="nav-link" data-link data-route="/graph">Graph</a>
        <a href="#/history" class="nav-link" data-link data-route="/history">File History</a>
        <a href="#/commits" class="nav-link" data-link data-route="/commits">Commits</a>
        <a href="#/settings" class="nav-link" data-link data-route="/settings">System</a>
      </nav>
      <div class="header-actions">
        <button type="button" class="btn btn-ghost btn-icon" id="btn-caps" aria-label="Platform capabilities" popovertarget="caps-popover">

    const uid = () => Math.random().toString(36).slice(2, 9);
    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }
    function formatDate(iso) {
      try {
        return new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "short" }).format(new Date(iso));
      } catch { return iso; }
    }
    function relativeTime(iso) {
      const diff = (Date.now() - new Date(iso).getTime()) / 1000;
      const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
      if (diff < 3600) return rtf.format(-Math.round(diff / 60), "minute");
      if (diff < 86400) return rtf.format(-Math.round(diff / 3600), "hour");
      if (diff < 604800) return rtf.format(-Math.round(diff / 86400), "day");
      return formatDate(iso);
    }
    function debounce(fn, ms = 180) {
      let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
    }
    function toast(msg, ms = 2600) {
      const region = document.getElementById("toasts");
      const el = document.createElement("div");

    // ============================================================
    // STORAGE & STATE
    // ============================================================
    const STORAGE_KEY = "git-lens-v1";
    function loadStore() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const d = JSON.parse(raw);
        return d?.version === 1 ? d : null;
      } catch { return null; }
    }
    function saveStore(s) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          version: 1, favorites: [...s.favorites], settings: s.settings, notes: s.notes
        }));
        return true;
      } catch { toast("Storage unavailable"); return false; }
    }

    const defaultSettings = { theme: "system", motion: "system" };
    function createState() {
      const saved = loadStore();
      return {
        favorites: new Set(saved?.favorites || []),
        notes: saved?.notes || {},
        settings: { ...defaultSettings, ...(saved?.settings || {}) },
        route: { path: "/", params: {} },
        filters: { query: "", branch: "all", author: "all" },
        selectedHash: null,
        selectedFile: null,
        graphMode: "repo" // repo | file
      };
    }

    let state = createState();
    const listeners = new Set();
    function getState() { return state; }
    function setState(partial) {
      state = { ...state, ...partial };
      if (partial.favorites || partial.settings || partial.notes) saveStore(state);
      listeners.forEach(fn => fn(state));
    }
    function subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }

    function dispatch(action) {
      switch (action.type) {
        case "SET_ROUTE": setState({ route: action.route }); break;
        case "SET_FILTERS": setState({ filters: { ...state.filters, ...action.filters } }); break;
        case "SELECT_COMMIT": setState({ selectedHash: action.hash }); break;
        case "SELECT_FILE": setState({ selectedFile: action.path, graphMode: action.path ? "file" : "repo" }); break;
        case "TOGGLE_FAV": {
          const next = new Set(state.favorites);
          if (next.has(action.hash)) next.delete(action.hash); else next.add(action.hash);
          setState({ favorites: next });
          toast(next.has(action.hash) ? "Bookmarked" : "Removed bookmark");
          break;
        }
        case "SET_SETTINGS":
          setState({ settings: { ...state.settings, ...action.settings } });
          applySettings();
          break;
        case "RESET":
          setState({ favorites: new Set(), notes: {}, settings: { ...defaultSettings } });
          applySettings();
          toast("Local data reset");
          break;
      }
    }

    // ============================================================
    // THEME
    // ============================================================
    function applySettings() {
      const { theme, motion } = state.settings;
      const root = document.documentElement;
      if (theme === "system") {
        root.dataset.theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      } else root.dataset.theme = theme;
      if (motion === "system") root.removeAttribute("data-motion");
      else root.dataset.motion = motion;
      const isDark = root.dataset.theme === "dark";
      document.querySelector(".icon-sun")?.classList.toggle("hidden", isDark);
      document.querySelector(".icon-moon")?.classList.toggle("hidden", !isDark);
    }

    // ============================================================
    // ROUTING (hash)
    // ============================================================
    function parseHash() {
      const hash = location.hash.slice(1) || "/";
      const parts = hash.replace(/\/$/, "").split("/").filter(Boolean);
      if (!parts.length) return { path: "/", params: {} };
      if (parts[0] === "graph") return { path: "/graph", params: {} };
      if (parts[0] === "history") return { path: "/history", params: { file: parts[1] ? decodeURIComponent(parts[1]) : null } };
      if (parts[0] === "commits") return { path: "/commits", params: {} };
      if (parts[0] === "commit" && parts[1]) return { path: "/commit", params: { hash: parts[1] } };
      if (parts[0] === "settings") return { path: "/settings", params: {} };
      return { path: "/404", params: {} };
    }
    function navigate(to, { replace = false } = {}) {
      const url = to.startsWith("#") ? to : `#${to}`;
      if (replace) history.replaceState(null, "", url);
      else history.pushState(null, "", url);
      handleRoute();
    }
    function handleRoute() {
      const route = parseHash();
      dispatch({ type: "SET_ROUTE", route });
      if (route.path === "/history" && route.params.file) {
        dispatch({ type: "SELECT_FILE", path: route.params.file });
      }
      updateNav(route.path);
      render();
      document.getElementById("main")?.focus({ preventScroll: true });
    }
    function updateNav(path) {
      document.querySelectorAll("[data-route]").forEach(el => {
        const r = el.getAttribute("data-route");
        el.setAttribute("aria-current", (r === path || (r === "/history" && path === "/history")) ? "page" : "false");
      });

    // ============================================================
    // GRAPH LAYOUT ENGINE
    // ============================================================
    function buildGraphLayout(commits, { fileFilter = null } = {}) {
      // Filter commits that touch the file (for file-history mode)
      let list = [...commits];
      if (fileFilter) {
        list = list.filter(c => c.files.some(f => f.path === fileFilter));
      }
      // Work oldest → newest for lane assignment
      const ordered = [...list].reverse();
      const hashToCommit = Object.fromEntries(ordered.map(c => [c.hash, c]));
      const positions = new Map(); // hash → { x, y, lane, color }
      const lanes = []; // active lane occupancy
      const ROW_H = 56;
      const LANE_W = 28;
      const PAD_X = 40;
      const PAD_Y = 28;

      function allocLane() {
        for (let i = 0; i < lanes.length; i++) if (lanes[i] === null) return i;
        lanes.push(null);
        return lanes.length - 1;
      }

      ordered.forEach((c, idx) => {
        let lane;
        // Prefer parent lane
        if (c.parents.length && positions.has(c.parents[0])) {
          lane = positions.get(c.parents[0]).lane;
        } else {
          lane = allocLane();
        }
        // Free parent lanes that are no longer needed (simplified)
        c.parents.forEach(p => {
          // keep simple: we don't free aggressively
        });
        lanes[lane] = c.hash;
        const color = BRANCH_COLORS[c.branch] || BRANCH_COLORS.main;
        positions.set(c.hash, {
          x: PAD_X + lane * LANE_W,
          y: PAD_Y + idx * ROW_H,
          lane,
          color,
          commit: c
        });
      });

      // Edges
      const edges = [];
      ordered.forEach(c => {
        const to = positions.get(c.hash);
        c.parents.forEach(ph => {
          const from = positions.get(ph);
          if (from && to) {
            edges.push({ from, to, isMerge: c.isMerge && c.parents[0] !== ph });
          }
        });
      });

      const width = PAD_X + Math.max(3, lanes.length) * LANE_W + 420;
      const height = PAD_Y * 2 + ordered.length * ROW_H;
      return { positions, edges, width, height, ordered };
    }

    function renderGraphSVG(container, layout, { onSelect } = {}) {
      container.replaceChildren();
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("class", "graph-svg");
      svg.setAttribute("width", layout.width);
      svg.setAttribute("height", layout.height);
      svg.setAttribute("viewBox", `0 0 ${layout.width} ${layout.height}`);
      svg.setAttribute("role", "img");
      svg.setAttribute("aria-label", "Commit graph");

      // Edges first
      const edgeGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
      layout.edges.forEach(e => {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        const midY = (e.from.y + e.to.y) / 2;
        const d = e.from.x === e.to.x
          ? `M${e.from.x},${e.from.y} L${e.to.x},${e.to.y}`
          : `M${e.from.x},${e.from.y} C${e.from.x},${midY} ${e.to.x},${midY} ${e.to.x},${e.to.y}`;
        path.setAttribute("d", d);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", e.isMerge ? "oklch(0.75 0.14 310)" : e.to.color);
        path.setAttribute("stroke-width", e.isMerge ? "2" : "1.75");
        path.setAttribute("opacity", "0.85");
        edgeGroup.appendChild(path);
      });
      svg.appendChild(edgeGroup);

      // Nodes + labels
      const nodeGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
      layout.ordered.forEach(c => {
        const pos = layout.positions.get(c.hash);
        if (!pos) return;
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("class", "graph-node");
        g.setAttribute("tabindex", "0");
        g.setAttribute("role", "button");
        g.setAttribute("aria-label", `${c.short}: ${c.message}`);
        g.dataset.hash = c.hash;
        if (state.selectedHash === c.hash) g.setAttribute("aria-selected", "true");

        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("cx", pos.x);
        circle.setAttribute("cy", pos.y);
        circle.setAttribute("r", c.isMerge ? 8 : 6);
        circle.setAttribute("fill", pos.color);
        circle.setAttribute("stroke", "var(--bg)");
        circle.setAttribute("stroke-width", "2");
        g.appendChild(circle);

        if (c.isMerge) {
          const inner = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          inner.setAttribute("cx", pos.x);
          inner.setAttribute("cy", pos.y);
          inner.setAttribute("r", 3);
          inner.setAttribute("fill", "var(--bg)");
          g.appendChild(inner);
        }

        const hashText = document.createElementNS("http://www.w3.org/2000/svg", "text");
        hashText.setAttribute("x", pos.x + 16);
        hashText.setAttribute("y", pos.y - 6);
        hashText.setAttribute("class", "graph-label");
        hashText.textContent = c.short;
        g.appendChild(hashText);

        const msgText = document.createElementNS("http://www.w3.org/2000/svg", "text");
        msgText.setAttribute("x", pos.x + 16);
        msgText.setAttribute("y", pos.y + 10);
        msgText.setAttribute("class", "graph-msg");
        const msg = c.message.length > 52 ? c.message.slice(0, 50) + "…" : c.message;
        msgText.textContent = msg;
        g.appendChild(msgText);

        g.addEventListener("click", () => onSelect?.(c.hash));
        g.addEventListener("keydown", (ev) => {
          if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); onSelect?.(c.hash); }
        });
        nodeGroup.appendChild(g);

    // ============================================================
    function detectCapabilities() {
      const s = (cond) => { try { return !!cond; } catch { return false; } };
      return [
        { name: "View Transitions", on: s(document.startViewTransition), desc: "Smooth view changes" },
        { name: "Container Queries", on: CSS.supports("container-type", "inline-size"), desc: "Adaptive commit rows" },
        { name: "Popover API", on: s(HTMLElement.prototype.hasOwnProperty("popover")), desc: "Capability panel" },
        { name: "<dialog>", on: s(typeof HTMLDialogElement !== "undefined"), desc: "Commit detail modal" },
        { name: ":has()", on: CSS.supports("selector(:has(*))"), desc: "Parent-state styling" },
        { name: "CSS Nesting", on: CSS.supports("selector(&)"), desc: "Organized styles" },
        { name: "Anchor Positioning", on: CSS.supports("anchor-name", "--a"), desc: "Future popover placement" },
        { name: "Scroll-driven Anim", on: CSS.supports("animation-timeline", "scroll()"), desc: "Progress effects" },
        { name: "Web Animations", on: s(Element.prototype.animate), desc: "Micro-interactions" },
        { name: "Canvas 2D", on: s(document.createElement("canvas").getContext("2d")), desc: "Hero particles" },
        { name: "localStorage", on: (() => { try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; } catch { return false; } })(), desc: "Bookmarks & settings" },
        { name: "Clipboard API", on: s(navigator.clipboard?.writeText), desc: "Copy commit hash" },
        { name: "Intl.RelativeTime", on: s(Intl.RelativeTimeFormat), desc: "Relative dates" }
      ];
    }
    function renderCapabilities() {
      const list = document.getElementById("cap-list");
      if (!list) return;
      list.replaceChildren(...detectCapabilities().map(c => {
        const row = document.createElement("div");
        row.className = "cap-item";
        row.innerHTML = `
          <span class="cap-dot ${c.on ? "on" : "off"}"></span>
          <span class="cap-name">${escapeHtml(c.name)}</span>
          <span class="text-xs" style="color:var(--text-faint)">${c.on ? "active" : "n/a"}</span>
          <span class="cap-desc">${escapeHtml(c.desc)}</span>`;
        return row;
      }));
    }

      const head = document.createElement("div");

        <p class="text-sm text-muted">${escapeHtml(c.author)} · ${formatDate(c.date)} · <span class="mono">${c.hash}</span></p>
        <div class="chip-group mt-2" style="margin-top:var(--space-3)">
          <span class="badge ${c.isMerge ? "badge-merge" : "badge-branch"}">${c.isMerge ? "merge" : escapeHtml(c.branch)}</span>
        </div>`;
      body.appendChild(head);

      const filesTitle = document.createElement("h3");
      filesTitle.className = "text-sm"; filesTitle.style.margin = "var(--space-5) 0 var(--space-2)";
      filesTitle.style.fontWeight = "650"; filesTitle.textContent = "Files changed";
      body.appendChild(filesTitle);

      const fileList = document.createElement("div");
      fileList.className = "file-list";
      c.files.forEach(f => {
        const row = document.createElement("div");
        row.className = "file-row";
        row.innerHTML = `<span class="status ${f.status}">${f.status}</span><span>${escapeHtml(f.path)}</span>`;
        row.addEventListener("click", () => {
          dialog.close();
          navigate(`#/history/${encodeURIComponent(f.path)}`);
        });
        fileList.appendChild(row);
      });
      body.appendChild(fileList);

      if (c.diff) {
        const diffTitle = document.createElement("h3");
        diffTitle.className = "text-sm"; diffTitle.style.margin = "var(--space-5) 0 var(--space-2)";
        diffTitle.style.fontWeight = "650"; diffTitle.textContent = "Diff excerpt";

        const pre = document.createElement("pre");
        pre.className = "diff-view card-body";
        pre.style.background = "var(--bg)"; pre.style.borderRadius = "var(--radius)";
        pre.style.padding = "var(--space-3)";
        c.diff.split("\n").forEach(line => {
          const span = document.createElement("div");
          if (line.startsWith("+") && !line.startsWith("+++")) span.className = "diff-add";
          else if (line.startsWith("-") && !line.startsWith("---")) span.className = "diff-del";
          else if (line.startsWith("@@")) span.className = "diff-hunk";
          span.textContent = line;
          pre.appendChild(span);
        });
        body.appendChild(pre);

      const footer = document.getElementById("dlg-footer");
      footer.replaceChildren();
      const copyBtn = document.createElement("button");
      copyBtn.type = "button"; copyBtn.className = "btn btn-secondary"; copyBtn.textContent = "Copy hash";
      copyBtn.addEventListener("click", async () => {

          await navigator.clipboard.writeText(c.hash);

        } catch { toast("Clipboard unavailable"); }

      favBtn.type = "button"; favBtn.className = "btn btn-secondary";
      favBtn.textContent = state.favorites.has(c.hash) ? "Unbookmark" : "Bookmark";
      favBtn.addEventListener("click", () => {
        dispatch({ type: "TOGGLE_FAV", hash: c.hash });

      const closeBtn = document.createElement("button");
      closeBtn.type = "button"; closeBtn.className = "btn btn-primary"; closeBtn.textContent = "Close";
      closeBtn.addEventListener("click", () => dialog.close());
      footer.append(copyBtn, favBtn, closeBtn);

      if (typeof dialog.showModal === "function") dialog.showModal();

    }

    // ============================================================
    // HERO CANVAS
    // ============================================================
    let heroAnim = null;
    function startHeroCanvas(canvas) {
      if (!canvas) return;
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches ||
        document.documentElement.dataset.motion === "reduce";
      const dpr = Math.min(devicePixelRatio || 1, 2);
      let w, h;
      const nodes = [];
      function resize() {
        w = canvas.clientWidth; h = canvas.clientHeight;
        canvas.width = w * dpr; canvas.height = h * dpr;
        canvas.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      function init() {
        nodes.length = 0;
        for (let i = 0; i < (reduce ? 8 : 18); i++) {
          nodes.push({
            x: Math.random() * w, y: Math.random() * h,
            vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.3,
            r: 2 + Math.random() * 2.5, a: 0.2 + Math.random() * 0.4
          });
        }
      }
      resize(); init();
      new ResizeObserver(() => { resize(); init(); }).observe(canvas);

      function frame() {
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, w, h);
        const g = ctx.createRadialGradient(w * 0.7, h * 0.3, 0, w * 0.5, h * 0.5, w * 0.8);
        g.addColorStop(0, "oklch(0.35 0.08 195 / 0.3)");
        g.addColorStop(1, "oklch(0.15 0.02 220 / 0)");
        ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
        if (reduce) return;
        // simple links
        ctx.strokeStyle = "oklch(0.7 0.1 195 / 0.15)";
        ctx.lineWidth = 1;
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const a = nodes[i], b = nodes[j];
            const dx = a.x - b.x, dy = a.y - b.y;
            if (dx * dx + dy * dy < 120 * 120) {
              ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
            }
          }
        }
        nodes.forEach(n => {
          n.x += n.vx; n.y += n.vy;
          if (n.x < 0 || n.x > w) n.vx *= -1;
          if (n.y < 0 || n.y > h) n.vy *= -1;
          ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
          ctx.fillStyle = `oklch(0.78 0.12 195 / ${n.a})`; ctx.fill();
        });
        heroAnim = requestAnimationFrame(frame);
      }
      const io = new IntersectionObserver(([e]) => {
        if (e.isIntersecting) { if (!heroAnim) heroAnim = requestAnimationFrame(frame); }
        else { cancelAnimationFrame(heroAnim); heroAnim = null; }
      }, { threshold: 0.1 });
      io.observe(canvas);
      if (!reduce) heroAnim = requestAnimationFrame(frame);
      else frame();
    }

    // ============================================================
    // RENDER DISPATCH
    // ============================================================
    function render() {
      const path = state.route.path;
      const update = () => {
        if (path === "/") renderOverview();
        else if (path === "/graph") renderGraph();
        else if (path === "/history") renderFileHistory();
        else if (path === "/commits") renderCommits();
        else if (path === "/commit") { openCommitDialog(state.route.params.hash); renderGraph(); }
        else if (path === "/settings") renderSettings();
        else render404();
      };
      if (document.startViewTransition && document.documentElement.dataset.motion !== "reduce") {
        document.startViewTransition(update);
      } else update();
    }

    // ============================================================
    // WIRING
    // ============================================================
    document.addEventListener("click", e => {
      const link = e.target.closest("[data-link]");
      if (link?.href) {
        const url = new URL(link.href);
        if (url.origin === location.origin && url.hash) {
          e.preventDefault();
          navigate(url.hash);
        }
      }
    });
    window.addEventListener("popstate", handleRoute);
    window.addEventListener("hashchange", handleRoute);
    document.getElementById("btn-theme")?.addEventListener("click", () => {
      const cur = state.settings.theme;
      const next = cur === "dark" ? "light" : cur === "light" ? "system" : "dark";
      dispatch({ type: "SET_SETTINGS", settings: { theme: next } });
      toast(`Theme: ${next}`);
    });
    document.getElementById("dlg-close")?.addEventListener("click", () => document.getElementById("commit-dialog").close());
    document.getElementById("commit-dialog")?.addEventListener("click", e => {
      if (e.target === e.currentTarget) e.currentTarget.close();
    });
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if (state.settings.theme === "system") applySettings();
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") document.getElementById("commit-dialog")?.close();
    });

    applySettings();
    renderCapabilities();
    handleRoute();
  </script>
</body>
</html>
