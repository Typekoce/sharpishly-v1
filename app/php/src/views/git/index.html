
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="Git Lens Workbench — zero-dependency visual Git history explorer" />
  <title>Git Lens Workbench</title>
  <style></style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="app-shell" id="app">
    <header class="app-header" role="banner">
      <a href="#/" class="brand" data-link>
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="8" cy="8" r="3" fill="var(--accent)"/>
          <circle cx="24" cy="8" r="3" fill="var(--success)"/>
          <circle cx="16" cy="24" r="3" fill="var(--merge)"/>
          <path d="M8 11v6c0 2 2 4 8 4s8-2 8-4v-6" stroke="var(--text-muted)" stroke-width="1.5" fill="none"/>
          <path d="M16 11v9" stroke="var(--text-muted)" stroke-width="1.5"/>
        </svg>
        <span>Git Lens</span>
      </a>
      <nav class="nav-main" aria-label="Primary">
        <a href="#/" class="nav-link" data-link data-route="/">Overview</a>
        <a href="#/graph" class="nav-link" data-link data-route="/graph">Graph</a>
        <a href="#/history" class="nav-link" data-link data-route="/history">File History</a>
        <a href="#/commits" class="nav-link" data-link data-route="/commits">Commits</a>
        <a href="#/settings" class="nav-link" data-link data-route="/settings">System</a>
      </nav>
      <div class="header-actions">
        <button type="button" class="btn btn-ghost btn-icon" id="btn-caps" aria-label="Platform capabilities" popovertarget="caps-popover">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
        <button type="button" class="btn btn-ghost btn-icon" id="btn-theme" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon-moon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z"/></svg>
        </button>
      </div>
    </header>

    <div class="main-content" id="main-layout">
      <aside class="sidebar" id="sidebar" aria-label="Filters"></aside>
      <main class="content-area" id="main" tabindex="-1"></main>
    </div>
  </div>

  <nav class="mobile-nav" aria-label="Mobile">
    <a href="#/" data-link data-route="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/></svg>Home</a>
    <a href="#/graph" data-link data-route="/graph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M6 8v4c0 2 2 4 6 4s6-2 6-4V8"/></svg>Graph</a>
    <a href="#/history" data-link data-route="/history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>History</a>
    <a href="#/commits" data-link data-route="/commits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Log</a>
    <a href="#/settings" data-link data-route="/settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>System</a>
  </nav>

  <div class="toast-region" id="toasts" aria-live="polite"></div>

  <div id="caps-popover" popover="auto" style="width:min(92vw,340px);padding:var(--space-4);">
    <h3 style="font-size:var(--text-sm);margin-bottom:var(--space-3);font-weight:650;">Platform Capabilities</h3>
    <div class="cap-grid" id="cap-list"></div>
  </div>

  <dialog id="commit-dialog">
    <div class="dialog-panel">
      <div class="dialog-header">
        <h2 class="card-title" id="dlg-title">Commit</h2>
        <button type="button" class="btn btn-ghost btn-icon" id="dlg-close" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="dialog-body" id="dlg-body"></div>
      <div class="dialog-footer" id="dlg-footer"></div>
    </div>
  </dialog>

  <script></script>
</body>
</html>
