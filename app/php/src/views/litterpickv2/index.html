<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1b4332"><title>CleanSweep — Neighbourhood Action</title>
<style>
@layer reset,tokens,base,layout,components,utilities,motion;
@layer reset{*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}}
@layer tokens{:root{color-scheme:light;--bg:#f8faf7;--surface:#fff;--ink:#1e293b;--muted:#64748b;--green:#1b4332;--leaf:#2d6a4f;--amber:#d97706;--red:#b42318;--blue:#2563eb;--border:#dce5dd;--shadow:0 10px 30px #173f2b12;--radius:18px;--space:clamp(1rem,2vw,1.4rem);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif} [data-theme=dark]{color-scheme:dark;--bg:#101b16;--surface:#182720;--ink:#e5eee8;--muted:#a7b7ac;--border:#34473b;--shadow:0 10px 30px #0003}}
@layer base{body{background:var(--bg);color:var(--ink);line-height:1.55;min-height:100dvh}h1,h2,h3{line-height:1.2;text-wrap:balance}h1{font-size:clamp(1.7rem,4vw,2.6rem)}h2{font-size:1.4rem}p{max-width:70ch}button{cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:12px;padding:.7rem .95rem;min-height:44px}button:hover{border-color:var(--leaf);transform:translateY(-1px)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d97706;outline-offset:3px}a{color:var(--leaf)}svg{max-width:100%}label{font-weight:650;display:block;margin:.35rem 0}input,select,textarea{width:100%;padding:.65rem;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--ink)}small,.muted{color:var(--muted)}}
@layer layout{.shell{max-width:1440px;margin:auto;padding:1rem}.header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);padding:.75rem 1rem;display:flex;gap:1rem;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:.65rem;font-weight:900;color:var(--green);font-size:1.1rem}.nav{display:flex;gap:.35rem;flex-wrap:wrap}.nav button{border:0;background:transparent}.nav button.active{background:var(--green);color:white}.grid{display:grid;gap:1rem}.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}.four{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.main{padding:1.25rem}.hero{display:grid;grid-template-columns:1fr;gap:1rem;background:linear-gradient(135deg,#e4f1e7,#fff);color:#1b4332;padding:clamp(1rem,3vw,2rem);border-radius:24px}.heroart{min-height:190px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:var(--space);box-shadow:var(--shadow)}.section{margin:1.4rem 0}.flex{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.sidebar{display:none}.bottomnav{display:none}.map{position:relative;min-height:430px;overflow:hidden;border-radius:20px;background:#e6efe7;border:1px solid var(--border)}.map svg{width:100%;height:430px}.maplist{display:grid;gap:.5rem}.badge{border-radius:999px;padding:.2rem .6rem;font-size:.8rem;background:#e6f2e9;color:#1b4332;display:inline-block}.pin{cursor:pointer}.feed{display:grid;gap:.8rem}.feeditem{border-left:3px solid var(--leaf);padding:.5rem .75rem}.modal{width:min(560px,94vw);border:1px solid var(--border);border-radius:20px;background:var(--surface);color:var(--ink);padding:1.2rem}.modal::backdrop{background:#12271c88}.toast{position:fixed;bottom:90px;right:1rem;background:var(--green);color:white;padding:1rem;border-radius:14px;z-index:40;box-shadow:var(--shadow);max-width:320px}.chart{width:100%;height:auto}.kpi strong{font-size:1.7rem;display:block}.kpi{font-variant-numeric:tabular-nums}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:.55rem;border-bottom:1px solid var(--border);text-align:left}.itemrow{display:flex;gap:.75rem;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding:.75rem 0}.itemrow:last-child{border:0}.step{display:flex;gap:.5rem;flex-wrap:wrap}.step span{background:var(--surface);border:1px solid var(--border);padding:.4rem;border-radius:8px}.foot{padding:1rem;color:var(--muted)}}
@layer components{.primary{background:var(--green);color:#fff;border-color:var(--green)}.alert{color:var(--amber);font-weight:800}.danger{color:var(--red)}.success{color:var(--leaf)}.wide{width:100%}.chip{padding:.3rem .65rem;border-radius:99px;border:1px solid var(--border)}.controls{display:flex;gap:.5rem;flex-wrap:wrap}.controls>*{flex:1 1 140px}.mini{font-size:.85rem}.chartbars{display:flex;align-items:end;gap:1rem;height:180px;padding:1rem}.barpair{flex:1;display:flex;align-items:end;gap:5px;justify-content:center;height:100%}.bar{width:45%;border-radius:8px 8px 0 0;background:var(--leaf);min-height:4px}.bar.recycle{background:#d97706}.barlabels{display:flex;justify-content:space-around;color:var(--muted);font-size:.8rem}.legend{display:flex;gap:1rem;flex-wrap:wrap}.legend i{display:inline-block;width:12px;height:12px;border-radius:4px}.mapkey{display:flex;gap:1rem;flex-wrap:wrap}.mapkey span{display:flex;align-items:center;gap:.4rem}.mapkey i{width:13px;height:13px;border-radius:50%;display:inline-block}.safe{border-left:5px solid var(--amber)}}
@layer utilities{.hidden{display:none!important}.muted{color:var(--muted)}.mt{margin-top:1rem}.mb{margin-bottom:1rem}.center{text-align:center}.nowrap{white-space:nowrap}}
@layer motion{*{transition:background-color .2s,color .2s,border-color .2s,transform .15s}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}}
@media(min-width:900px){.hero{grid-template-columns:1.3fr .7fr;align-items:center}.main{padding:2rem}.header{padding:.75rem 2rem}}
@media(max-width:767px){.header{position:static;display:block}.nav{display:none}.bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:20;justify-content:space-around;padding:.35rem env(safe-area-inset-right,.4rem) calc(.35rem + env(safe-area-inset-bottom)) env(safe-area-inset-left,.4rem)}.bottomnav button{border:0;background:none;font-size:.76rem;padding:.5rem}.main{padding:1rem}.toast{bottom:90px;left:1rem;right:1rem}.heroart{min-height:150px}}
@media print{.header,.bottomnav,.controls,button,.foot{display:none!important}.main{padding:0}.card{box-shadow:none}.hero{background:white}.shell{max-width:none}}
</style></head>
<body>
<a href="#content" style="position:absolute;left:-9999px" id="skip">Skip to content</a>
<header class="header"><div class="brand"><svg width="42" height="42" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#1b4332"/><path d="M24 36V19M24 25C12 25 12 12 12 12s12 0 12 13M24 21C36 21 36 9 36 9S24 9 24 21" fill="none" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round"/></svg><span>CleanSweep <small>Neighbourhood action</small></span></div><nav class="nav" id="nav" aria-label="Primary navigation"></nav><div class="controls"><button id="themeBtn" title="Toggle dark mode">◐ Theme</button><button id="shareBtn">Invite neighbours ↗</button></div></header>
<main id="content" class="main shell" tabindex="-1"></main><nav class="bottomnav" id="bottom" aria-label="Mobile navigation"></nav><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<dialog id="modal" class="modal"><div id="modalbody"></div><form method="dialog"><button class="mt">Close</button></form></dialog>
<script type="module">
/* CleanSweep: single-file civic SPA. Seed figures are illustrative. */
const App={data:null};
const routes=[['dashboard','Home'],['map','Map'],['events','Events'],['report','Report'],['equipment','Kit'],['leaderboard','Impact'],['safety','Safety']];
const seed={
metrics:{bags:438,kg:276,volunteers:86,hotspots:31},
events:[{id:'e1',name:'Saturday Park & Pavement Pick',date:'2026-11-28T10:00',place:'Chorlton Green, by the noticeboard',duration:90,access:'Mostly level paths',family:true,spots:18,joined:5},{id:'e2',name:'Riverbank Reset',date:'2026-12-05T09:30',place:'Merchants Bridge footpath',duration:120,access:'Uneven, muddy ground',family:false,spots:20,joined:8},{id:'e3',name:'Winter High Street Sweep',date:'2026-12-12T11:00',place:'Library steps, Beech Road',duration:60,access:'Wheelchair-accessible route',family:true,spots:24,joined:12}],
hotspots:[{id:'h1',name:'Beech Road corner',kind:'litter',status:'needs',x:32,y:38,detail:'Food packaging around bus stop',time:'Today'},{id:'h2',name:'Lane behind shops',kind:'fly',status:'council',x:63,y:53,detail:'Bulky waste dumped; council notified',time:'Yesterday'},{id:'h3',name:'Park gate drain',kind:'litter',status:'needs',x:72,y:28,detail:'Plastic bottles near drain',time:'2 days ago'},{id:'h4',name:'Community Hub',kind:'hub',status:'hub',x:46,y:70,detail:'Kit lending & bag pickup',time:'Open hours vary'},{id:'h5',name:'Oakfield Avenue',kind:'cleared',status:'cleared',x:25,y:72,detail:'Adopted and recently cleared',time:'3 days ago'},{id:'h6',name:'Canal towpath',kind:'hazard',status:'council',x:81,y:65,detail:'Suspected hazardous material — keep clear',time:'Reported today'}],
streets:['Beech Road','Oakfield Avenue','Wilbraham Road','Barlow Moor Road','Nell Lane','Chorlton Green','Oswald Road','Edge Lane','Hurstville Road','Seymour Grove','Albert Road','Longford Road'],
volunteers:[{name:'Green Guardians',bags:72,streak:5},{name:'Maya R.',bags:49,streak:3},{name:'The Saturday Crew',bags:43,streak:4},{name:'Jamal K.',bags:38,streak:2},{name:'Parkside Pals',bags:31,streak:2}],
kit:[{name:'Adult litter pickers',qty:16},{name:'Kids’ pickers',qty:8},{name:'Hi-vis vests',qty:22},{name:'Heavy-duty bag hoops',qty:9},{name:'Sharps boxes',qty:3},{name:'First aid kits',qty:5}],
activity:[{text:'Green Guardians cleared Oakfield Avenue — 8 bags sorted.',when:'Today'},{text:'Council collection confirmed for Lane behind shops.',when:'Yesterday'},{text:'Maya R. checked in for the Sunday solo pick.',when:'2 days ago'},{text:'Park gate drain hotspot reported.',when:'2 days ago'}],
logs:[],rsvps:[],reservations:[],safety:[],adoptions:[],badges:[],prefs:{theme:'light'}
};
const Storage={load(){try{let s=JSON.parse(localStorage.getItem('cleansweep-v1')||'{}');return {...structuredClone(seed),...s,metrics:{...seed.metrics,...s.metrics},prefs:{...seed.prefs,...s.prefs}}}catch{return structuredClone(seed)}},save(){try{localStorage.setItem('cleansweep-v1',JSON.stringify(App.data))}catch{toast('Storage unavailable — changes may not persist.')}}};
App.data=Storage.load();
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=d=>new Intl.DateTimeFormat('en-GB',{dateStyle:'medium',timeStyle:'short'}).format(new Date(d));
function toast(msg,undo){let t=$('#toast');t.textContent=msg;if(undo){let b=document.createElement('button');b.textContent='Undo';b.onclick=undo;t.append(b)}t.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hidden'),4000)}
function save(){Storage.save()}
function nav(){let route=location.hash.replace('#/','')||'dashboard';if(!routes.some(r=>r[0]===route))route='dashboard';document.title=`${routes.find(r=>r[0]===route)[1]} · CleanSweep`;$('#nav').replaceChildren();$('#bottom').replaceChildren();routes.forEach(([id,label],i)=>{for(let target of ['nav','bottom']){let b=document.createElement('button');b.textContent=(target==='bottom'?['⌂','⌖','◷','＋','♧','★','!'][i]+' ':'')+label;b.className=route===id?'active':'';b.onclick=()=>location.hash='/'+id;$(target==='#nav'?'#nav':'#bottom').append(b)}});render(route)}
function card(content,extra=''){return `<article class="card ${extra}">${content}</article>`}
function hero(){return `<section class="hero section"><div><span class="badge">Small actions. Cleaner streets.</span><h1>Make our neighbourhood shine.</h1><p>Pick together, report trouble spots and look after the streets we share. Every bag counts.</p><div class="controls"><button class="primary" onclick="location.hash='/events'">Join the next pick</button><button onclick="location.hash='/report'">Report a hotspot</button></div></div><div class="heroart"><svg viewBox="0 0 400 210" role="img" aria-label="Illustration of volunteers tending a leafy neighbourhood"><path d="M0 170Q90 130 160 170T400 160V210H0" fill="#b7d9b9"/><path d="M40 170V80L110 30 180 80V170M200 170V100L260 55 320 100V170" fill="#f5d7a1" stroke="#1b4332" stroke-width="4"/><path d="M75 170V120H140V170M235 170V120H285V170" fill="#fff" stroke="#1b4332" stroke-width="3"/><circle cx="355" cy="55" r="35" fill="#d97706" opacity=".7"/><g fill="#2d6a4f"><circle cx="28" cy="108" r="32"/><circle cx="36" cy="72" r="22"/><circle cx="344" cy="128" r="35"/><circle cx="366" cy="95" r="25"/></g><g stroke="#1b4332" stroke-width="5" stroke-linecap="round"><path d="M60 190l10-45 10 45M120 190l-8-38 12 10 8-10 10 38"/><path d="M300 190l8-48 10 18 10-18 8 48"/></g></svg></div></section>`}
function dashboard(){let m=App.data.metrics;return `${hero()}<section class="grid four section">${[['Bags collected',m.bags,'🛍'],['Weight diverted',m.kg+' kg','♻'],['Active volunteers',m.volunteers,'👥'],['Hotspots cleared',m.hotspots,'✓']].map(([a,b,c])=>card(`<div class="kpi"><span>${c} ${a}</span><strong>${b}</strong><small>Community demo data</small></div>`)).join('')}</section><section class="grid two section">${card(`<div class="flex between"><h2>Community momentum</h2><span class="badge">Last 6 months</span></div><div class="chartbars" aria-label="Monthly bags collected chart">${[36,48,58,70,85,100].map((h,i)=>`<div class="barpair"><div class="bar" style="height:${h}%"></div><div class="bar recycle" style="height:${h*(.45+i*.07)}%"></div></div>`).join('')}</div><div class="barlabels"><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span><span>Nov</span></div><div class="legend"><span><i style="background:var(--leaf)"></i> Bags</span><span><i style="background:var(--amber)"></i> Recycling share (illustrative)</span></div>`),card(`<h2>Next group pick</h2><h3>${esc(App.data.events[0].name)}</h3><p>📍 ${esc(App.data.events[0].place)}<br>🗓 ${fmtDate(App.data.events[0].date)} · ${App.data.events[0].duration} minutes</p><p id="countdown" class="badge">Countdown loading…</p><button class="primary wide" onclick="rsvp('e1')">I'm joining!</button>`)} </section><section class="grid two section">${card(`<h2>Recent community activity</h2><div class="feed">${App.data.activity.map(a=>`<div class="feeditem"><strong>${esc(a.when)}</strong><br>${esc(a.text)}</div>`).join('')}</div>`)}${card(`<h2>Neighbourhood call to action</h2><p>See a hotspot? Report it with a location and clear details. Hazardous waste should be left to trained responders.</p><button onclick="location.hash='/map'">Explore hotspot map</button><button onclick="location.hash='/report'">Make a report</button>`)} </section>`}
function mapView(){let pins=App.data.hotspots;return `<h1>Street & hotspot map</h1><p class="muted">Illustrative neighbourhood grid — pin positions are not real coordinates.</p><div class="controls mb"><label><input type="checkbox" id="fNeeds" checked> Needs attention</label><label><input type="checkbox" id="fCouncil" checked> Council / hazards</label><label><input type="checkbox" id="fCleared" checked> Cleared streets</label><label><input type="checkbox" id="fHub" checked> Kit hubs</label></div><div class="map card"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-label="Illustrative street map"><rect width="100" height="100" fill="#dcebdc"/><path d="M-10 20L110 20M-10 48L110 48M-10 76L110 76M20 -10L20 110M48 -10L48 110M76 -10L76 110" stroke="#fff" stroke-width="6"/><path d="M-10 35L110 65M35 -10L65 110" stroke="#c6d8c8" stroke-width="3"/><g id="pins"></g></svg></div><div class="mapkey mt"><span><i style="background:#2d6a4f"></i> Cleared</span><span><i style="background:#d97706"></i> Needs attention</span><span><i style="background:#b42318"></i> Council / hazard</span><span><i style="background:#2563eb"></i> Hub</span></div><div class="controls mt"><button class="primary" onclick="openHotspot()">＋ Drop a pin</button><button onclick="claimStreet()">Adopt a street</button><button onclick="locate()">Use my location</button></div><div class="maplist mt">${pins.map(p=>card(`<div class="flex between"><strong>${esc(p.name)}</strong><span class="badge">${p.status}</span></div><p>${esc(p.detail)} · ${esc(p.time)}</p>`)).join('')}</div>`}
function events(){return `<h1>Group picks & events</h1><p>Come along for an hour, meet neighbours and make a visible difference.</p><div class="grid two section">${App.data.events.map(e=>card(`<span class="badge">${e.family?'Family friendly':'Adult group'}</span><h2>${esc(e.name)}</h2><p>📍 ${esc(e.place)}<br>🗓 ${fmtDate(e.date)}<br>⏱ ${e.duration} mins<br>♿ ${esc(e.access)}</p><p><strong>${e.joined} / ${e.spots}</strong> joined</p><div class="controls"><button class="primary" onclick="rsvp('${e.id}')">RSVP</button><button onclick="downloadICS('${e.id}')">Add to calendar</button><button onclick="print()">Print flyer</button></div>`)).join('')}</div><section class="section">${card(`<h2>Past picks</h2><p>October Park Sweep — 19 volunteers, 26 bags collected, park entrance and paths cleared. Illustrative outcome.</p><p>Autumn Lane Walk — 12 volunteers, 14 bags, litter sorted for council pickup.</p>`)}</section>`}
function report(){return `<h1>Report litter or log a pick</h1><div class="grid two section"><article class="card"><h2>Report a hotspot</h2><form id="reportForm"><label>Category<select name="category"><option>General litter</option><option>Overflowing bin</option><option>Fly-tipping</option><option>Sharps / hazardous</option><option>Graffiti</option></select></label><label>Severity <output id="sev">3</output>/5<input type="range" min="1" max="5" value="3" name="severity" id="severity"></label><label>Location<input name="location" required placeholder="Street, landmark or map location"></label><label>Description<textarea name="description" rows="3" placeholder="What have you noticed?"></textarea></label><label>Photo (optional)<input type="file" accept="image/*" name="photo"></label><div id="preview"></div><div class="controls mt"><button type="button" onclick="locateForReport()">Auto-locate</button><button type="submit" class="primary">Create council report</button></div></form><div id="councilOutput"></div></article><article class="card"><h2>Log my solo pick</h2><form id="logForm"><label>Street(s) covered<input name="streets" required></label><label>Bags collected<input name="bags" type="number" min="1" required></label><label>Recycling bags<input name="recycle" type="number" min="0" value="0"></label><label>Minutes volunteered<input name="minutes" type="number" min="1" value="30"></label><button class="primary mt">Save pick log</button></form><p class="muted">Personal entries are saved locally on this device.</p></article></div>`}
function equipment(){return `<h1>Community kit library</h1><p>Reserve reusable equipment. Availability is a local demo inventory, not a real hub stock check.</p><div class="grid two section">${App.data.kit.map(k=>card(`<div class="flex between"><h2>${esc(k.name)}</h2><span class="badge">${k.qty} available</span></div><button class="primary wide" onclick="borrow('${esc(k.name)}')">Reserve kit</button>`)).join('')}</div><section class="card section"><h2>Borrowing checklist</h2><ol><li>Collect kit and inspect handles, hooks and PPE.</li><li>Keep kit together and return clean/dry where possible.</li><li>Report damage or missing items to the hub coordinator.</li></ol><div id="reservations">${App.data.reservations.map(r=>`<p>${esc(r.name)} · ${esc(r.hub)} · ${esc(r.date)}</p>`).join('')}</div></section>`}
function leaderboard(){return `<h1>Community impact & badges</h1><div class="controls mt"><select id="rankfilter"><option>This month</option><option>All time</option><option>Most improved street</option></select></div><div class="grid two section">${card(`<h2>Volunteer leaderboard</h2>${App.data.volunteers.map((v,i)=>`<div class="itemrow"><strong>${i+1}. ${esc(v.name)}</strong><span>${v.bags} bags · ${v.streak} week streak</span></div>`).join('')}`)}${card(`<h2>Achievement badges</h2><div class="grid two">${[['First Bag Hero','🛍','Log your first bag'],['Dawn Patroller','🌅','Join an early pick'],['Fly-Tip Spotter','📣','Report fly-tipping'],['100-Bag Centurion','🏆','Collect 100 bags'],['Storm Drain Guardian','💧','Keep drains clear safely']].map(b=>`<div class="card center"><div style="font-size:2rem">${b[1]}</div><strong>${b[0]}</strong><small>${b[2]}</small></div>`).join('')}</div>`)}${card(`<h2>Volunteer impact certificate</h2><label>Your name<input id="certName" placeholder="Name"></label><button class="primary mt" onclick="certificate()">Generate printable certificate</button>`)}${card(`<h2>Adopt a street</h2><p>Choose a street to steward: periodic litter checks, reporting and friendly encouragement. No private or hazardous cleanup.</p><button onclick="claimStreet()">Start adoption</button><p>${App.data.adoptions.map(s=>esc(s)).join(', ')||'No streets adopted yet.'}</p>`)}</div>`}
function safety(){let items=['I will wear suitable gloves and hi-vis, and closed footwear.','I will not handle sharps, suspected asbestos, chemicals or unknown substances.','I will stay away from water edges, traffic and unstable waste.','I will use bags and tools safely and avoid overfilling or lifting heavy items.','I know how to report hazards and call emergency services if needed.'];return `<h1>Safety briefing</h1><p>Complete this checklist before your first RSVP or kit reservation. This is a general guide; follow local authority and site-specific instructions.</p>${card(`<form id="safetyForm">${items.map((x,i)=>`<label><input type="checkbox" name="s${i}" ${App.data.safety.includes(i)?'checked':''}> ${x}</label>`).join('')}<button class="primary mt">Save briefing</button></form><p id="safetyStatus">${App.data.safety.length===items.length?'Briefing complete ✓':'Complete each item before booking or borrowing.'}</p>`)}<section class="grid two section">${card(`<h2>Leave these to trained professionals</h2><ul><li>Sharps or needles: do not touch or move; report immediately.</li><li>Suspected asbestos, chemical containers or unknown powders: keep clear.</li><li>Dead wildlife: avoid contact; report through council channels.</li><li>Fly-tipping: do not climb, open containers or attempt heavy removal.</li><li>Waterways and steep banks: work from a safe distance only.</li></ul>`,'safe')}${card(`<h2>Emergency & reporting</h2><p><strong>Emergency:</strong> 999 for immediate danger or serious injury.</p><p><strong>Environment Agency incident hotline:</strong> 0800 80 70 60 (UK; check applicability and current guidance).</p><p><strong>Council:</strong> Use your local authority’s official website for litter, fly-tipping and street cleansing reports.</p><p>Do not enter unsafe areas to gather evidence.</p>`,'safe')}</section>`}
function render(route){let html=({dashboard,map:mapView,events,report,equipment,leaderboard,safety}[route]||dashboard)();let main=$('#content');if(document.startViewTransition)document.startViewTransition(()=>main.innerHTML=html);else main.innerHTML=html;setTimeout(()=>bind(route),0)}
function bind(route){if(route==='map')drawPins();if(route==='dashboard')countdown();if(route==='report'){let form=$('#reportForm');$('#severity').oninput=e=>$('#sev').value=e.target.value;form.onsubmit=submitReport;$('#logForm').onsubmit=submitLog;form.querySelector('[type=file]').onchange=previewPhoto;}if(route==='safety')$('#safetyForm').onsubmit=saveSafety;if(route==='leaderboard')$('#rankfilter').onchange=e=>toast('Filter selected: '+e.target.value+' (demo ranking)')}
function drawPins(){let g=$('#pins');if(!g)return;g.replaceChildren();App.data.hotspots.forEach(p=>{let color=p.status==='cleared'?'#2d6a4f':p.status==='needs'?'#d97706':p.status==='hub'?'#2563eb':'#b42318';let c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r','3.6');c.setAttribute('fill',color);c.setAttribute('stroke','white');c.setAttribute('stroke-width','1');c.setAttribute('tabindex','0');c.setAttribute('role','button');c.setAttribute('aria-label',p.name+': '+p.detail);c.onclick=()=>toast(p.name+' — '+p.detail);g.append(c);let filters={needs:$('#fNeeds')?.checked,council:$('#fCouncil')?.checked,cleared:$('#fCleared')?.checked,hub:$('#fHub')?.checked};let allowed=p.status==='needs'?filters.needs:p.status==='council'?filters.council:p.status==='cleared'?filters.cleared:filters.hub;c.style.display=allowed?'':'none'})}
function openModal(html){$('#modalbody').innerHTML=html;$('#modal').showModal();$('#modal').onclose=()=>{}}
function openHotspot(){openModal(`<h2>Drop a hotspot pin</h2><form id="pinForm"><label>Street / landmark<input required name="name"></label><label>Category<select name="kind"><option value="litter">General litter</option><option value="fly">Fly-tipping</option><option value="hazard">Hazardous</option></select></label><label>Details<textarea name="detail" rows="2"></textarea></label><button class="primary mt">Add pin</button></form>`);$('#pinForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);App.data.hotspots.unshift({id:uid(),name:f.get('name'),kind:f.get('kind'),status:f.get('kind')==='litter'?'needs':'council',x:50,y:50,detail:f.get('detail')||f.get('kind'),time:'Just now'});save();$('#modal').close();nav();toast('Pin added')}}
function claimStreet(){openModal(`<h2>Adopt a street</h2><form id="adopt"><label>Street<select name="street">${App.data.streets.map(s=>`<option>${esc(s)}</option>`).join('')}</select></label><label>Team / volunteer<input name="who" placeholder="Your name or group"></label><button class="primary mt">Adopt street</button></form>`);$('#adopt').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),s=f.get('street');if(!App.data.adoptions.includes(s))App.data.adoptions.push(s);App.data.activity.unshift({text:`${f.get('who')||'A neighbour'} adopted ${s}.`,when:'Just now'});save();$('#modal').close();toast(s+' adopted!');if(location.hash==='#/leaderboard')nav()}}
function rsvp(id){if(!App.data.safety.length||App.data.safety.length<5){toast('Please complete the safety briefing first.');location.hash='/safety';return}let e=App.data.events.find(x=>x.id===id);if(!e)return;if(App.data.rsvps.includes(id)){toast('You already RSVP’d');return}e.joined++;App.data.rsvps.push(id);save();toast('RSVP saved for '+e.name);if(location.hash==='#/events')nav()}
function countdown(){let e=App.data.events[0],el=$('#countdown');if(!el)return;function tick(){let ms=new Date(e.date)-new Date();if(ms<=0){el.textContent='Pick time has arrived!';return}let d=Math.floor(ms/86400000),h=Math.floor(ms%86400000/3600000),m=Math.floor(ms%3600000/60000);el.textContent=`${d}d ${h}h ${m}m to go`}tick();setInterval(tick,60000)}
function downloadICS(id){let e=App.data.events.find(x=>x.id===id),dt=new Date(e.date).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');let end=new Date(new Date(e.date).getTime()+e.duration*60000).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');let ics=`BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//CleanSweep//Community Pick//EN\nBEGIN:VEVENT\nUID:${e.id}@cleansweep.local\nDTSTAMP:${dt}\nDTSTART:${dt}\nDTEND:${end}\nSUMMARY:${e.name}\nLOCATION:${e.place}\nDESCRIPTION:Community litter pick. Bring suitable gloves and footwear.\nEND:VEVENT\nEND:VCALENDAR`;download(ics,'cleansweep-pick.ics','text/calendar')}
function submitReport(e){e.preventDefault();let f=new FormData(e.target),ref='CS-'+Date.now().toString(36).toUpperCase(),cat=f.get('category'),loc=f.get('location'),desc=f.get('description'),severity=f.get('severity');let reportObj={ref,category:cat,location:loc,description:desc,severity,date:new Date().toISOString()};App.data.activity.unshift({text:`Hotspot report ${ref} logged for ${loc}.`,when:'Just now'});App.data.hotspots.unshift({id:ref,name:loc,kind:cat,status:cat==='Fly-tipping'||cat==='Sharps / hazardous'?'council':'needs',x:50,y:50,detail:desc||cat,time:'Just now'});save();let text=`Street-cleansing report ${ref}\nCategory: ${cat}\nSeverity: ${severity}/5\nLocation: ${loc}\nDetails: ${desc}\nDate: ${new Date().toLocaleString('en-GB')}\nPlease acknowledge and advise on collection / action.`;$('#councilOutput').innerHTML=`<div class="card mt"><h3>Report reference: ${esc(ref)}</h3><textarea id="reportText" rows="7">${esc(text)}</textarea><div class="controls"><button onclick="copyReport()">Copy report</button><a href="mailto:?subject=${encodeURIComponent('Street cleansing report '+ref)}&body=${encodeURIComponent(text)}">Email council</a></div><small>Use your council’s official reporting channel; this app does not transmit reports.</small></div>`;toast('Report created locally. Council submission not sent.')}
function copyReport(){let t=$('#reportText');t.select();navigator.clipboard?.writeText(t.value).then(()=>toast('Copied report')).catch(()=>toast('Select and copy manually'))}
function submitLog(e){e.preventDefault();let f=new FormData(e.target),obj={streets:f.get('streets'),bags:+f.get('bags'),recycle:+f.get('recycle'),minutes:+f.get('minutes'),date:new Date().toISOString()};App.data.logs.push(obj);App.data.metrics.bags+=obj.bags;App.data.metrics.kg+=obj.bags*0.6;App.data.activity.unshift({text:`Solo pick logged: ${obj.bags} bags around ${obj.streets}.`,when:'Just now'});if(obj.bags>=100&&!App.data.badges.includes('100-Bag Centurion'))App.data.badges.push('100-Bag Centurion');save();e.target.reset();toast('Solo pick saved');}
async function previewPhoto(e){let file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')||file.size>8e6){toast('Choose an image under 8 MB');e.target.value='';return}let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,1200/img.width);c.width=img.width*scale;c.height=img.height*scale;let ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);ctx.fillStyle='#173f2b';ctx.fillRect(0,c.height-30,c.width,30);ctx.fillStyle='white';ctx.font='16px sans-serif';ctx.fillText(new Date().toLocaleString('en-GB'),10,c.height-10);$('#preview').innerHTML=`<img alt="Compressed report photo preview" src="${c.toDataURL('image/jpeg',.72)}" style="max-width:100%;border-radius:12px">`;URL.revokeObjectURL(url)};img.onerror=()=>URL.revokeObjectURL(url);img.src=url}
function locateForReport(){if(!navigator.geolocation){toast('Geolocation unavailable');return}navigator.geolocation.getCurrentPosition(p=>{let f=$('#reportForm');f.elements.location.value=`Approx. ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`;toast('Location added; verify before reporting')},()=>toast('Location permission denied'))}
function locate(){if(!navigator.geolocation){toast('Geolocation unavailable');return}navigator.geolocation.getCurrentPosition(p=>toast(`Position: ${p.coords.latitude.toFixed(4)}, ${p.coords.longitude.toFixed(4)} (map is illustrative)`),()=>toast('Location permission denied'))}
function borrow(name){if(App.data.safety.length<5){toast('Complete the safety briefing first.');location.hash='/safety';return}openModal(`<h2>Reserve ${esc(name)}</h2><form id="borrow"><label>Pickup hub<select name="hub"><option>Community Hub</option><option>Library collection point</option><option>Park volunteer shed</option></select></label><label>Pickup date<input type="date" name="date" required></label><label>Return date<input type="date" name="return" required></label><button class="primary mt">Confirm reservation</button></form>`);$('#borrow').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);App.data.reservations.push({name,hub:f.get('hub'),date:f.get('date'),return:f.get('return')});save();$('#modal').close();toast('Reservation saved locally');nav()}}
function saveSafety(e){e.preventDefault();let f=new FormData(e.target);App.data.safety=[0,1,2,3,4].filter(i=>f.has('s'+i));save();toast('Briefing saved');nav()}
function certificate(){let name=$('#certName').value||'Community Volunteer';let w=window.open('','_blank');if(!w){toast('Allow popups to print certificate');return}w.document.write(`<html><title>CleanSweep Certificate</title><body style="font-family:system-ui;text-align:center;padding:10vh;border:10px solid #1b4332"><h1>Volunteer Impact Certificate</h1><h2>${esc(name)}</h2><p>Recognised for helping keep our neighbourhood clean, safe and welcoming.</p><p>CleanSweep Community Scheme</p><p>${new Date().toLocaleDateString('en-GB')}</p><button onclick="print()">Print / Save PDF</button></body></html>`)}
function download(data,name,type){let blob=new Blob([data],{type}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function uid(){return 'id'+Math.random().toString(36).slice(2,9)}
function exportJSON(){download(JSON.stringify(App.data,null,2),'cleansweep-backup.json','application/json')}
function exportCSV(){let rows=[['Date','Street','Bags','Recycling bags','Minutes'],...App.data.logs.map(l=>[l.date,l.streets,l.bags,l.recycle,l.minutes])];download(rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'cleansweep-logs.csv','text/csv')}
function share(){let url=location.href.split('#')[0];if(navigator.share)navigator.share({title:'CleanSweep Neighbourhood Scheme',text:'Join our local litter-picking community!',url}).catch(()=>{});else navigator.clipboard?.writeText(url).then(()=>toast('Invite link copied')).catch(()=>toast(url))}
$('#themeBtn').onclick=()=>{App.data.prefs.theme=App.data.prefs.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=App.data.prefs.theme;save()};$('#shareBtn').onclick=share;
window.rsvp=rsvp;window.downloadICS=downloadICS;window.openHotspot=openHotspot;window.claimStreet=claimStreet;window.borrow=borrow;window.certificate=certificate;window.copyReport=copyReport;window.print=()=>window.print();
window.addEventListener('hashchange',nav);document.documentElement.dataset.theme=App.data.prefs.theme;nav();
</script>
</body></html>
