<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Aegis Command — Cybersecurity Operations Platform</title>
<style>
@layer reset, tokens, base, layout, components, utilities, motion;

@layer reset {
  *,*::before,*::after{box-sizing:border-box}
  *{margin:0}
  html{color-scheme:dark;scroll-behavior:smooth}
  body{min-height:100dvh;-webkit-text-size-adjust:100%}
  img,svg,canvas,video{display:block;max-width:100%}
  button,input,select,textarea{font:inherit;color:inherit}
  button{background:none;border:0;cursor:pointer}
  a{color:inherit}
  ul,ol{padding:0;list-style:none}
  table{border-collapse:collapse;width:100%}
}

@layer tokens {
  :root{
    --canvas:#060913;
    --surface:#0f172a;
    --surface-2:#111c31;
    --line:color-mix(in oklab,#00f0ff 18%,#0f172a);
    --text:#e8f2fb;
    --muted:#9fb0c6;
    --cyan:#00f0ff;
    --emerald:#10b981;
    --crimson:#f43f5e;
    --amber:#fbbf24;
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 18px 50px rgb(0 0 0 / .38);
    --ring:0 0 0 3px color-mix(in oklab,var(--cyan) 45%,transparent);
    --space-1:.35rem; --space-2:.65rem; --space-3:1rem; --space-4:1.5rem; --space-5:2.25rem;
    --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --max:1500px;
  }
  @media (prefers-contrast:more){
    :root{--text:#fff;--muted:#d8e4f2;--line:#7c8ba3}
  }
}

@layer base {
  body{
    background:
      radial-gradient(1100px 620px at 82% -8%,rgb(0 240 255 / .09),transparent),
      radial-gradient(900px 500px at 8% 100%,rgb(16 185 129 / .08),transparent),
      var(--canvas);
    color:var(--text);
    font-family:var(--font);
    line-height:1.55;
    font-size:clamp(.94rem,.88rem + .18vw,1.03rem);
  }
  h1,h2,h3,h4{text-wrap:balance;line-height:1.15;letter-spacing:-.015em}
  h1{font-size:clamp(2rem,1.35rem + 3vw,3.5rem)}
  h2{font-size:clamp(1.45rem,1.15rem + 1.3vw,2.1rem)}
  h3{font-size:clamp(1.1rem,1rem + .5vw,1.35rem)}
  p{text-wrap:pretty}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:none;box-shadow:var(--ring)}
  :user-invalid{border-color:var(--crimson)!important}
  code,kbd,pre{font-family:var(--mono);font-size:.88em}
  kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:.1em .38em;background:#0a1120}
  .num{font-variant-numeric:tabular-nums}
}

@layer layout {
  .shell{width:min(100% - 2rem,var(--max));margin-inline:auto}
  .topbar{
    position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:var(--space-3);
    padding:.7rem 0;background:color-mix(in oklab,var(--canvas) 88%,transparent);
    backdrop-filter:blur(14px);border-bottom:1px solid var(--line)
  }
  .brand{display:flex;align-items:center;gap:.65rem;font-weight:800;letter-spacing:-.03em}
  .brand svg{width:34px;height:34px}
  .nav{display:flex;gap:.2rem;margin-left:auto;overflow:auto;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav a{
    display:grid;place-items:center;min-height:44px;padding:.45rem .75rem;border-radius:999px;
    color:var(--muted);text-decoration:none;white-space:nowrap;border:1px solid transparent
  }
  .nav a:hover{color:var(--text);background:#0b1425}
  .nav a[aria-current="page"]{color:#04121a;background:var(--cyan);font-weight:750}
  .mode{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .mode button{min-height:44px;padding:.4rem .8rem;color:var(--muted)}
  .mode button[aria-pressed="true"]{background:color-mix(in oklab,var(--cyan) 18%,#0b1425);color:var(--text)}
  main{padding-block:var(--space-5) 5rem;min-height:70dvh}
  .grid{display:grid;gap:var(--space-3)}
  .cols-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
  .cols-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
  .section{margin-top:var(--space-5)}
  .page-head{max-width:72ch;margin-bottom:var(--space-4)}
  .eyebrow{color:var(--cyan);font:750 .72rem/1 var(--mono);text-transform:uppercase;letter-spacing:.16em}
  .hero{display:grid;gap:var(--space-4);grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);align-items:center}
  .hero-copy{max-width:60ch}
  .actions{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:var(--space-3)}
  .footer{border-top:1px solid var(--line);padding:var(--space-4) 0;color:var(--muted);font-size:.85rem}
  @media (max-width:920px){.hero{grid-template-columns:1fr}.nav{width:100%;order:3}}
  @media (max-width:620px){
    .topbar{flex-wrap:wrap}
    .mode{order:2;margin-left:auto}
    .nav{order:3;width:100%}
  }
}

@layer components {
  .card{
    container-type:inline-size;
    background:linear-gradient(145deg,color-mix(in oklab,var(--surface) 94%,#fff 6%),var(--surface));
    border:1px solid var(--line);border-radius:var(--radius);padding:var(--space-4);box-shadow:var(--shadow)
  }
  .card.tight{padding:var(--space-3)}
  .card h3{margin-bottom:.4rem}
  .metric{display:grid;gap:.2rem}
  .metric b{font-size:clamp(1.5rem,1.2rem + 1vw,2.1rem);color:var(--cyan)}
  .badge{
    display:inline-flex;align-items:center;gap:.35rem;padding:.22rem .55rem;border-radius:999px;
    border:1px solid var(--line);font:700 .7rem/1.2 var(--mono);text-transform:uppercase
  }
  .badge.critical{color:#ffe4e9;background:color-mix(in oklab,var(--crimson) 22%,transparent);border-color:var(--crimson)}
  .badge.high{color:#fff4d6;background:color-mix(in oklab,var(--amber) 20%,transparent);border-color:var(--amber)}
  .badge.medium{color:#d9fff5;background:color-mix(in oklab,var(--emerald) 18%,transparent);border-color:var(--emerald)}
  .badge.info{color:#d8fbff;background:color-mix(in oklab,var(--cyan) 14%,transparent);border-color:var(--cyan)}
  .btn{
    display:inline-grid;place-items:center;min-height:44px;padding:.6rem 1rem;border-radius:999px;
    border:1px solid var(--line);background:#0b1425;color:var(--text);text-decoration:none;font-weight:650
  }
  .btn:hover{background:#12203a}
  .btn.primary{background:var(--cyan);border-color:transparent;color:#04121a}
  .btn.primary:hover{background:color-mix(in oklab,var(--cyan) 82%,#fff)}
  .btn.danger{border-color:var(--crimson);color:#ffdbe2}
  .btn.small{min-height:36px;padding:.35rem .7rem;font-size:.85rem}
  .field{display:grid;gap:.35rem;margin-bottom:var(--space-3)}
  .field label{font-size:.85rem;font-weight:700}
  .field small{color:var(--muted)}
  input,select,textarea{
    width:100%;min-height:44px;padding:.65rem .8rem;border-radius:var(--radius-sm);
    border:1px solid var(--line);background:#0a1120;color:var(--text)
  }
  textarea{min-height:110px;resize:vertical}
  .toolbar{display:flex;flex-wrap:wrap;gap:.55rem;align-items:center;margin-bottom:var(--space-3)}
  .toolbar input,.toolbar select{width:auto;min-width:150px}
  .chip{
    min-height:36px;padding:.3rem .7rem;border-radius:999px;border:1px solid var(--line);
    background:#0a1120;color:var(--muted);font-size:.82rem
  }
  .chip[aria-pressed="true"]{color:#04121a;background:var(--cyan);border-color:transparent}
  .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius-sm)}
  table{min-width:640px}
  th,td{padding:.7rem .8rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{position:sticky;top:0;background:#0b1425;color:var(--cyan);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}
  tbody tr:hover{background:#0c1729}
  .list{display:grid;gap:.55rem}
  .list li{display:flex;gap:.6rem;align-items:flex-start}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--cyan);margin-top:.45rem;flex:none}
  .dot.green{background:var(--emerald)}
  .dot.red{background:var(--crimson)}
  .dot.amber{background:var(--amber)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:.35rem .8rem;font-size:.9rem}
  .kv dt{color:var(--muted)}
  .muted{color:var(--muted)}
  .mono{font-family:var(--mono)}
  .code{
    background:#050a14;border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:.8rem;overflow:auto;white-space:pre-wrap;font-family:var(--mono);font-size:.82rem
  }
  .viz{position:relative;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#04070f}
  .viz canvas{width:100%;height:min(48vh,430px)}
  .viz-label{position:absolute;left:1rem;top:1rem;font:700 .72rem/1 var(--mono);color:var(--cyan);text-transform:uppercase}
  .gauge{display:grid;place-items:center;gap:.4rem}
  .gauge svg{width:min(100%,230px)}
  .thread{border:1px solid var(--line);border-radius:var(--radius-sm);padding:var(--space-3);background:#0a1120}
  .thread + .thread{margin-top:.7rem}
  .thread-head{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between}
  .reply{margin:.7rem 0 0 1.2rem;border-left:2px solid var(--line);padding-left:.8rem}
  .dialog{width:min(92vw,760px);border:1px solid var(--line);border-radius:var(--radius);padding:var(--space-4);background:var(--surface);color:var(--text)}
  .dialog::backdrop{background:rgb(2 4 10 / .72);backdrop-filter:blur(4px)}
  .dialog-head{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;margin-bottom:var(--space-3)}
  .popover{
    position:fixed;inset:auto auto 1rem 1rem;z-index:80;width:min(92vw,430px);margin:0;
    border:1px solid var(--line);border-radius:var(--radius);padding:var(--space-3);
    background:var(--surface);color:var(--text);box-shadow:var(--shadow)
  }
  .popover::backdrop{background:transparent}
  .capability{display:grid;grid-template-columns:auto 1fr;gap:.3rem .7rem;font-size:.85rem}
  .capability b{color:var(--cyan)}
  .score-ring{width:min(100%,210px)}
  .empty{padding:var(--space-4);text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius-sm)}
  .skip{position:absolute;left:-9999px;top:0;z-index:100;background:var(--cyan);color:#04121a;padding:.7rem 1rem;border-radius:0 0 10px 0}
  .skip:focus{left:0}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
}

@layer utilities {
  .mt-1{margin-top:var(--space-1)}.mt-2{margin-top:var(--space-2)}.mt-3{margin-top:var(--space-3)}
  .mb-2{margin-bottom:var(--space-2)}.mb-3{margin-bottom:var(--space-3)}
  .flex{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
  .between{justify-content:space-between}
  .right{margin-left:auto}
  .hidden{display:none!important}
  .wrap-anywhere{overflow-wrap:anywhere}
}

@layer motion {
  @media (prefers-reduced-motion:no-preference){
    .card,.btn,.chip,.thread{transition:transform .18s ease,background .18s ease,border-color .18s ease}
    .btn:hover{transform:translateY(-1px)}
    .card:hover{border-color:color-mix(in oklab,var(--cyan) 40%,var(--line))}
    @keyframes pulse{50%{opacity:.35}}
    .pulse{animation:pulse 2.2s ease-in-out infinite}
    @starting-style{.dialog{opacity:0;transform:translateY(14px)}}
    .dialog{transition:opacity .2s ease,transform .2s ease,overlay .2s allow-discrete,display .2s allow-discrete}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  }
  @supports (animation-timeline:scroll()){
    .progress{position:fixed;top:0;left:0;height:3px;width:100%;transform-origin:0 50%;background:linear-gradient(90deg,var(--cyan),var(--emerald));z-index:60;animation:grow linear both;animation-timeline:scroll()}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  }
  @supports not (animation-timeline:scroll()){
    .progress{display:none}
  }
}
</style>
</head>
<body>
<div class="progress" aria-hidden="true"></div>
<a class="skip" href="#main">Skip to main content</a>

<header class="topbar shell">
  <a class="brand" href="#/command" aria-label="Aegis Command home">
    <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3 34 9v11c0 9-6 15-14 17C12 35 6 29 6 20V9Z" fill="none" stroke="#00f0ff" stroke-width="2.4"/><path d="m13 20 5 5 9-10" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/></svg>
    <span>Aegis Command</span>
  </a>
  <div class="mode" role="group" aria-label="Audience mode">
    <button type="button" id="mode-b2b" aria-pressed="true">B2B Enterprise</button>
    <button type="button" id="mode-b2c" aria-pressed="false">B2C Personal</button>
  </div>
  <nav class="nav" aria-label="Primary">
    <a href="#/command">Command</a>
    <a href="#/threats">Threats</a>
    <a href="#/protocols">Protocols</a>
    <a href="#/governance">Governance</a>
    <a href="#/forum">Threat Exchange</a>
    <a href="#/toolkit">Toolkit</a>
    <a href="#/settings">Settings</a>
  </nav>
</header>

<main id="main" class="shell" tabindex="-1">
  <div id="view" aria-live="polite"></div>
</main>

<footer class="footer">
  <div class="shell flex between">
    <span>© 2026 Aegis Command · Educational security operations interface. No live telemetry or external requests.</span>
    <button class="btn small" id="capabilities-btn" popovertarget="capabilities">Platform capabilities</button>
  </div>
</footer>

<div id="capabilities" class="popover" popover>
  <div class="flex between mb-2"><h3>Platform capabilities</h3><button class="btn small" popovertarget="capabilities" popovertargetaction="hide">Close</button></div>
  <div id="capability-list" class="capability"></div>
</div>

<dialog id="detail" class="dialog" aria-labelledby="detail-title">
  <div class="dialog-head">
    <div><p class="eyebrow" id="detail-kind">Detail</p><h2 id="detail-title"></h2></div>
    <button class="btn small" id="detail-close">Close</button>
  </div>
  <div id="detail-body"></div>
</dialog>

<dialog id="booking" class="dialog" aria-labelledby="booking-title">
  <div class="dialog-head">
    <div><p class="eyebrow">Engagement</p><h2 id="booking-title">Request security support</h2></div>
    <button class="btn small" id="booking-close">Close</button>
  </div>
  <form id="booking-form" novalidate>
    <div class="field"><label for="bk-service">Service</label><select id="bk-service" required></select></div>
    <div class="field"><label for="bk-org">Organization or household</label><input id="bk-org" required autocomplete="organization"></div>
    <div class="field"><label for="bk-email">Contact email</label><input id="bk-email" type="email" required autocomplete="email" inputmode="email"></div>
    <div class="field" id="bk-team-field"><label for="bk-team">Team size</label><select id="bk-team"><option>1–25</option><option>26–250</option><option>251–2,000</option><option>2,000+</option></select></div>
    <div class="field" id="bk-compliance-field"><label for="bk-compliance">Primary compliance target</label><select id="bk-compliance"><option>SOC 2 Type II</option><option>ISO/IEC 27001</option><option>HIPAA</option><option>GDPR</option><option>None yet</option></select></div>
    <div class="field"><label for="bk-context">Context</label><textarea id="bk-context" required placeholder="Describe the environment, concern, or incident. Do not include credentials, private keys, or sensitive production data."></textarea></div>
    <p id="booking-error" class="badge critical hidden" role="alert"></p>
    <div class="flex mt-3"><button class="btn primary" type="submit">Submit request</button><button class="btn" type="button" id="booking-reset">Reset</button></div>
  </form>
</dialog>

<script type="module">
'use strict';

/* ============================== Utilities ============================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(tag,props={},children=[])=>{
  const n=document.createElement(tag);
  for(const[k,v]of Object.entries(props)){
    if(k==='class')n.className=v;
    else if(k==='text')n.textContent=v;
    else if(k==='html')throw new Error('innerHTML is prohibited for untrusted content');
    else if(k.startsWith('on')&&typeof v==='function')n.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null)n.setAttribute(k,v===true?'':String(v));
  }
  for(const c of [].concat(children))if(c!=null)n.append(c);
  return n;
};
const debounce=(fn,ms=180)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
const storage={
  get(k,fallback){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fallback}catch{return fallback}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}},
  remove(k){try{localStorage.removeItem(k)}catch{}}
};
const copy=async text=>{
  try{await navigator.clipboard.writeText(text);return true}
  catch{
    const ta=el('textarea',{readonly:true});ta.value=text;document.body.append(ta);ta.select();
    const ok=document.execCommand('copy');ta.remove();return ok;
  }
};
const fmt=new Intl.NumberFormat();
const relTime=ts=>{
  const rtf=new Intl.RelativeTimeFormat(undefined,{numeric:'auto'});
  const diff=(ts-Date.now())/1000,units=[['year',31536000],['month',2592000],['day',86400],['hour',3600],['minute',60]];
  for(const[u,s]of units)if(Math.abs(diff)>=s)return rtf.format(Math.round(diff/s),u);
  return rtf.format(Math.round(diff),'second');
};

/* ============================== State ============================== */
const State=(()=>{
  const listeners=new Set();
  let state={
    mode:storage.get('aegis.mode','b2b'),
    savedThreats:storage.get('aegis.saved',[]),
    savedProtocols:storage.get('aegis.protocols',[]),
    threads:storage.get('aegis.threads',null),
    readiness:storage.get('aegis.readiness',{}),
    route:location.hash||'#/command'
  };
  const persist=()=>{
    storage.set('aegis.mode',state.mode);
    storage.set('aegis.saved',state.savedThreats);
    storage.set('aegis.protocols',state.savedProtocols);
    storage.set('aegis.threads',state.threads);
    storage.set('aegis.readiness',state.readiness);
  };
  return{
    get:s=>structuredClone(state[s]),
    set(patch,save=true){
      state={...state,...patch};
      if(save)persist();
      listeners.forEach(fn=>fn(state));
    },
    subscribe(fn){listeners.add(fn);return()=>listeners.delete(fn)}
  };
})();

/* ============================== Domain data ============================== */
const ThreatData={
  attacks:[
    {id:'ransomware',name:'Ransomware',category:'Ransomware',severity:'critical',killChain:'Initial access, privilege escalation, lateral movement, data staging, encryption, extortion.',mechanics:'An adversary gains a foothold through exposed remote access, stolen credentials, or an exploited internet-facing service; escalates privileges; disables protections; exfiltrates data; then deploys encryptors across reachable systems.',iocs:['New scheduled tasks or services invoking binaries from user-writable paths','Mass file-extension changes and ransom notes','SMB/Admin share access outside change windows','Outbound transfers to unfamiliar storage endpoints'],b2b:['Segment networks and restrict lateral SMB/RDP access','Maintain immutable, tested offline backups','Enforce phishing-resistant MFA and privileged-access management','Use EDR containment, MDR escalation, and incident-response retainers'],b2c:['Keep automatic OS and application updates enabled','Maintain an offline copy of important files','Never pay or call numbers in a ransom note; report to local authorities','Use a reputable backup service with version history'],controls:['MFA','EDR','Network segmentation','Backup immutability','Incident response'],refs:['NIST SP 800-61','CIS Control 11']},
    {id:'supply-chain',name:'Software supply-chain compromise',category:'Supply Chain',severity:'critical',killChain:'Dependency selection, malicious publish/update, build distribution, downstream execution, persistence.',mechanics:'An attacker compromises a package, build pipeline, update channel, vendor, or code-signing process, causing trusted software distribution mechanisms to deliver malicious code.',iocs:['Unexpected dependency-version changes','New post-install scripts or unusual build artifacts','Package registry publish events from unfamiliar accounts','Signed binaries with revoked or anomalous certificates'],b2b:['Generate an SBOM and verify dependencies','Pin versions and use signed provenance attestations','Restrict CI/CD permissions and isolate build runners','Monitor vendor advisories and maintain a software inventory'],b2c:['Install software only from official vendor stores or sites','Enable automatic updates','Review requested permissions before installing browser extensions or mobile apps'],controls:['SBOM','Code signing','CI/CD hardening','Vendor risk management'],refs:['OWASP Top 10 A08','NIST SSDF']},

/* ============================== Router ============================== */
const Router=(()=>{
  const routes=new Map();
  const parse=()=>{const h=location.hash||'#/command';const[path,query]=h.slice(1).split('?');return{path:path||'/command',params:new URLSearchParams(query||'')}};
  const titles={'/command':'Command Center','/threats':'Threat Intelligence','/protocols':'Protocols & Cryptography','/governance':'Methodologies & Governance','/forum':'Threat Exchange','/toolkit':'Security Toolkit','/settings':'Settings'};
  const go=path=>{location.hash=path.startsWith('#')?path:'#'+path};
  const render=()=>{
    const{path,params}=parse();
    const view=routes.get(path)||routes.get('/not-found');
    State.set({route:'#'+path+(params.toString()?'?'+params:'')},false);
    const update=()=>{view(params);document.title=`${titles[path]||'Not found'} — Aegis Command`;
      $$('.nav a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+path?'page':'false'));};
    document.startViewTransition&&!matchMedia('(prefers-reduced-motion: reduce)').matches?document.startViewTransition(update):update();
  };
  addEventListener('hashchange',render);
  return{register(path,fn){routes.set(path,fn)},start(){if(!location.hash)location.replace('#/command');render()}};
})();

    const live=$('#live-region');if(!live)return;
    live.setAttribute('aria-live',assertive?'assertive':'polite');live.textContent='';
    requestAnimationFrame(()=>live.textContent=msg);
  }
};

const Command={

    new ResizeObserver(()=>this.resize()).observe(this.canvas);
    new IntersectionObserver(entries=>{this.visible=entries[0].isIntersecting;this.loop()},{threshold:.05}).observe(this.canvas);

      el('section',{class:'section'},[el('h3',{text:'Discussion board'}),el('div',{class:'mt-3'},[toolbar,shown.length?el('div',{},shown.map(Forum.threadCard)):el('div',{class:'empty',text:'No threads match the selected filters.'})])])
    );
  },
  threadCard(t){
    const card=el('article',{class:'thread'},[
      el('div',{class:'thread-head'},[
        el('div',{},[el('strong',{text:t.title}),el('p',{class:'muted',text:`${t.author} · ${t.channel} · ${relTime(t.time)}`})]),
        el('div',{class:'flex'},[UI.badge(t.severity,t.severity.toLowerCase()),...t.tags.map(x=>UI.badge(x)),t.verified?UI.badge('Verified','medium'):null])
      ]),
      el('p',{class:'mt-2',text:t.body}),
      el('div',{class:'flex mt-2'},[
        el('button',{class:'chip',type:'button',onclick:e=>Forum.upvote(t.id,e.target),text:`▲ ${t.up} upvotes`}),
        el('button',{class:'chip',type:'button',onclick:e=>Forum.verify(t.id,e.target),text:t.verified?'✔ Verified':'○ Verify'}),
        el('button',{class:'chip',type:'button',onclick:()=>Forum.expand(t.id),text:`💬 ${t.replies.length} replies`})
      ]),
      el('div',{id:`replies-${t.id}`,class:'hidden'})
    ]);
    return card;
  },
  expand(id){
    const box=$(`#replies-${CSS.escape(id)}`);const t=State.get('threads').find(x=>x.id===id);
    if(box.classList.contains('hidden')){
      box.replaceChildren(...(t.replies.length?t.replies.map(r=>el('div',{class:'reply'},[el('strong',{text:r.author}),el('p',{class:'muted',text:relTime(r.time)}),el('p',{text:r.body})])):[el('p',{class:'muted',text:'No replies yet.'})]));
      box.classList.remove('hidden');
    }else box.classList.add('hidden');
  },
  upvote(id,btn){
    const threads=State.get('threads');const t=threads.find(x=>x.id===id);t.up++;
    State.set({threads});btn.textContent=`▲ ${t.up} upvotes`;UI.announce('Thread upvoted.');
  },
  verify(id,btn){
    const threads=State.get('threads');const t=threads.find(x=>x.id===id);t.verified=!t.verified;
    State.set({threads});btn.textContent=t.verified?'✔ Verified':'○ Verify';UI.announce(t.verified?'Thread marked verified.':'Verification removed.');
  },
  composer(){
    const form=el('form',{onsubmit:e=>{e.preventDefault();Forum.submit(e.target)}},[
      el('div',{class:'field'},[el('label',{for:'f-channel',text:'Channel'}),el('select',{id:'f-channel'},Forum.channels.map(c=>el('option',{value:c,text:c})))]),
      el('div',{class:'field'},[el('label',{for:'f-title',text:'Title'}),el('input',{id:'f-title',required,maxlength:'120',placeholder:'Concise incident or research topic'})]),
      el('div',{class:'field'},[el('label',{for:'f-author',text:'Display name'}),el('input',{id:'f-author',required,maxlength:'40',placeholder:'Analyst or community member'})]),
      el('div',{class:'field'},[el('label',{for:'f-severity',text:'Severity'}),el('select',{id:'f-severity'},['CRITICAL','ADVISORY','INFO'].map(s=>el('option',{value:s,text:s})))]),
      el('div',{class:'field'},[el('label',{for:'f-tags',text:'Tags (comma separated)'}),el('input',{id:'f-tags',placeholder:'Phishing, MFA, Detection'})]),
      el('div',{class:'field'},[el('label',{for:'f-body',text:'Report'}),el('textarea',{id:'f-body',required,placeholder:'Describe the observable behavior, impact, and defensive action. Redact sensitive details.'})]),
      el('div',{class:'flex'},[el('button',{class:'btn primary',type:'submit',text:'Publish thread'}),el('button',{class:'btn',type:'reset',text:'Clear'})])

  submit(form){

    const thread={

      severity:$('#f-severity').value,tags:$('#f-tags').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,6),

    UI.announce('Thread published to the local threat exchange.');

/* ============================== Toolkit ============================== */
const Toolkit={
  render(){
    const view=$('#view');
    view.replaceChildren(
      el('div',{class:'page-head'},[el('p',{class:'eyebrow',text:'Interactive security toolkit'}),el('h2',{text:'Private, client-side utilities'}),el('p',{class:'muted',text:'All analysis occurs in your browser. Do not enter real passwords, production secrets, or sensitive email content.'})]),
      el('div',{class:'grid cols-2'},[Toolkit.entropy(),Toolkit.headers()]),
      el('section',{class:'section'},[Toolkit.phishing()])
    );
    Toolkit.entropyUpdate();
  },
  entropy(){
    return UI.card('Password & passphrase entropy analyzer',[
      el('div',{class:'field'},[el('label',{for:'pw',text:'Candidate password or passphrase'}),el('input',{id:'pw',type:'text',autocomplete:'off',spellcheck:'false',oninput:()=>Toolkit.entropyUpdate()}),el('small',{text:'Use a disposable sample. Nothing is transmitted or stored.'})]),
      el('div',{id:'entropy-out',class:'code','aria-live':'polite'}),
      el('button',{class:'btn small mt-2',type:'button',onclick:()=>{$('#pw').value='';Toolkit.entropyUpdate()},text:'Clear sample'})
    ]);
  },
  entropyUpdate(){
    const pw=$('#pw')?.value||'';
    let pool=0;
    if(/[a-z]/.test(pw))pool+=26;if(/[A-Z]/.test(pw))pool+=26;
    if(/[0-9]/.test(pw))pool+=10;if(/[^A-Za-z0-9]/.test(pw))pool+=33;
    const bits=pw.length?Math.log2(pool)*pw.length:0;
    const guesses=Math.pow(2,Math.min(bits,128));
    const seconds=guesses/1e11;
    const years=seconds/31557600;
    const issues=[];
    if(/(.)\1{2,}/.test(pw))issues.push('Repeated characters reduce effective variety.');
    if(/^(?:password|qwerty|admin|letmein|123456)/i.test(pw))issues.push('Common dictionary pattern detected.');
    if(pw.length<16)issues.push('Prefer at least 16 characters or a four-to-six-word passphrase.');
    if(!/[0-9]/.test(pw)&&!/[^A-Za-z]/.test(pw))issues.push('Add digits or symbols for a broader keyspace.');
    const human=years>1e9?'Centuries+ at the modeled offline attack rate':years>1?'Approximately '+years.toExponential(2)+' years':'Less than one year';
    $('#entropy-out').replaceChildren(
      el('div',{text:`Character pool: ${pool} · Entropy: ${bits.toFixed(1)} bits`}),
      el('div',{text:`Modeled offline crack estimate: ${human}`}),
      el('div',{text:issues.length?'Weaknesses: '+issues.join(' '):'No common pattern weakness detected in this local heuristic.'})
    );
  },
  headers(){
    const options=[
      ['hsts','Strict-Transport-Security',"max-age=31536000; includeSubDomains; preload"],
      ['csp','Content-Security-Policy',"default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"],
      ['frame','X-Frame-Options','DENY'],
      ['permissions','Permissions-Policy',"camera=(), microphone=(), geolocation=()"],
      ['nosniff','X-Content-Type-Options','nosniff'],
      ['referrer','Referrer-Policy','strict-origin-when-cross-origin']
    ];
    const box=el('div',{class:'card'},[
      el('h3',{text:'HTTP security header & CSP generator'}),
      el('div',{class:'mt-2'},options.map(([id,label])=>el('label',{class:'flex',style:'margin-bottom:.45rem'},[
        el('input',{type:'checkbox',id:`hdr-${id}`,checked:id==='hsts'||id==='csp'||id==='nosniff',onchange:Toolkit.headersUpdate}),
        el('span',{text:label})
      ]))),
      el('pre',{id:'header-output',class:'code mt-2'}),
      el('button',{class:'btn small mt-2',type:'button',onclick:async e=>{const ok=await copy($('#header-output').textContent);UI.announce(ok?'Security headers copied.':'Copy unavailable in this browser.');e.target.textContent=ok?'Copied':'Copy failed'}},'Copy configuration')
    ]);
    return box;
  },
  headersUpdate(){
    const lines=[];
    if($('#hdr-hsts')?.checked)lines.push('Strict-Transport-Security: max-age=31536000; includeSubDomains; preload');
    if($('#hdr-csp')?.checked)lines.push("Content-Security-Policy: default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'");
    if($('#hdr-frame')?.checked)lines.push('X-Frame-Options: DENY');
    if($('#hdr-permissions')?.checked)lines.push('Permissions-Policy: camera=(), microphone=(), geolocation=()');
    if($('#hdr-nosniff')?.checked)lines.push('X-Content-Type-Options: nosniff');
    if($('#hdr-referrer')?.checked)lines.push('Referrer-Policy: strict-origin-when-cross-origin');
    $('#header-output').textContent=lines.join('\n')||'Select at least one header.';
  },
  phishing(){
    return UI.card('Phishing URL & email header inspector',[
      el('div',{class:'field'},[el('label',{for:'phish-input',text:'Paste a URL or email header snippet'}),el('textarea',{id:'phish-input',placeholder:'https://secure-paypa1.example/login\nReceived: from suspicious-mailer.example',oninput:debounce(()=>Toolkit.phishInspect(),150)})]),
      el('div',{id:'phish-output',class:'code','aria-live':'polite',text:'Paste content to inspect locally.'})
    ]);
  },
  phishInspect(){
    const raw=$('#phish-input').value.trim();const out=$('#phish-output');
    if(!raw){out.textContent='Paste content to inspect locally.';return}
    const findings=[];
    let url;try{url=new URL(raw.match(/https?:\/\/[^\s]+/i)?.[0]||'https://invalid.invalid')}catch{url=null}
    if(url){
      const host=url.hostname.toLowerCase();
      if(/[-_]/.test(host))findings.push('Hyphens or underscores can support impersonation; verify the registrable domain independently.');
      if(/(paypa1|g00gle|amaz0n|micr0soft|app1e)/i.test(host))findings.push('Character-substitution pattern commonly used in brand impersonation.');
      if(/\.(zip|mov|top|xyz|click|loan|cam)$/.test(host))findings.push('TLD frequently abused in malicious campaigns; treat as untrusted until verified.');
      if(url.protocol!=='https:')findings.push('Connection is not HTTPS; do not submit credentials.');
      if(url.username||url.password)findings.push('Embedded credentials detected in the URL.');
      if(!findings.length)findings.push('No obvious URL-level indicator found; domain reputation and page content still require verification.');
    }else findings.push('No parsable URL found; inspecting header text.');
    if(/urgent|immediately|suspend|verify now|account locked|final warning/i.test(raw))findings.push('Urgency or threat language detected; legitimate organizations normally let you initiate contact through a known channel.');
    if(/received: from|received-spf|authentication-results/i.test(raw))findings.push('Email header detected. Validate SPF, DKIM, and DMARC results against the actual sending infrastructure.');
    out.replaceChildren(el('strong',{text:'Local inspection results'}),document.createTextNode('\n\n'+findings.map((f,i)=>`${i+1}. ${f}`).join('\n')));
  }
};

/* ============================== Settings ============================== */
const Settings={
  render(){
    const view=$('#view');
    const exportBtn=el('button',{class:'btn',type:'button',onclick:()=>{
      const data={version:1,exportedAt:new Date().toISOString(),mode:State.get('mode'),savedThreats:State.get('savedThreats'),savedProtocols:State.get('savedProtocols'),threads:State.get('threads'),readiness:State.get('readiness')};
      const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
      const a=el('a',{href:url,download:'aegis-command-data.json'});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
    }},'Export local data');
    const importInput=el('input',{type:'file',accept:'application/json,.json','aria-label':'Import Aegis Command JSON data',onchange:e=>{
      const file=e.target.files[0];if(!file)return;
      if(file.size>2_000_000){UI.announce('Import file exceeds the 2 MB limit.',true);return}
      const reader=new FileReader();
      reader.onload=()=>{
        try{
          const data=JSON.parse(reader.result);
          if(data.version!==1||typeof data!=='object')throw new Error('Unsupported data format');
          State.set({mode:data.mode==='b2c'?'b2c':'b2b',savedThreats:Array.isArray(data.savedThreats)?data.savedThreats:[],savedProtocols:Array.isArray(data.savedProtocols)?data.savedProtocols:[],threads:Array.isArray(data.threads)?data.threads:[],readiness:data.readiness&&typeof data.readiness==='object'?data.readiness:{}});
          UI.announce('Local data imported successfully.');
        }catch(err){UI.announce('Import failed: '+err.message,true)}
      };
      reader.readAsText(file);e.target.value='';
    }});
    view.replaceChildren(
      el('div',{class:'page-head'},[el('p',{class:'eyebrow',text:'Settings & system'}),el('h2',{text:'Preferences, data, and platform support'}),el('p',{class:'muted',text:'Aegis Command stores only non-sensitive preferences and locally created forum content in your browser. It performs no external network requests for core functionality.'})]),
      el('div',{class:'grid cols-2'},[
        UI.card('Audience & appearance',[
          el('p',{class:'muted',text:'The audience switcher tailors services, recommendations, booking options, and defensive guidance.'}),
          el('div',{class:'flex mt-2'},[
            el('button',{class:'chip',type:'button',onclick:()=>{State.set({mode:'b2b'});Router.go('#/command')},text:'Use B2B Enterprise'}),
            el('button',{class:'chip',type:'button',onclick:()=>{State.set({mode:'b2c'});Router.go('#/command')},text:'Use B2C Personal'})
          ]),
          el('p',{class:'muted mt-2',text:'The interface follows your operating-system reduced-motion and increased-contrast preferences where supported.'})
        ]),
        UI.card('Local data',[
          el('div',{class:'flex'},[exportBtn,el('label',{class:'btn',text:'Import JSON'},[importInput])]),
          el('button',{class:'btn danger mt-2',type:'button',onclick:()=>{
            if(confirm('Clear all locally saved Aegis Command preferences and forum posts?')){['aegis.mode','aegis.saved','aegis.protocols','aegis.threads','aegis.readiness'].forEach(storage.remove);location.reload()}
          }},'Clear local data')
        ]),
        UI.card('About this platform',[
          el('p',{text:'Aegis Command is an educational cybersecurity operations and decision-support interface. Simulated telemetry, threat levels, and service availability are illustrative.'}),
          el('p',{class:'muted mt-2',text:'For an active intrusion, ransomware event, or account takeover, follow your organization’s incident-response process or contact the legitimate support channel for the affected service.'})
        ]),
        UI.card('Capability inspector',[
          el('div',{id:'settings-capabilities',class:'capability'}),
          el('button',{class:'btn small mt-2',type:'button',popovertarget:'capabilities',text:'Open detailed capability panel'})
        ])
      ])
    );
    Capabilities.render($('#settings-capabilities'));
  }

      ['View Transitions',!!document.startViewTransition,'Animated route and detail transitions'],

      ['Container queries',CSS.supports('container-type','inline-size'),'Responsive component layouts'],
      ['Container style queries',CSS.supports('container-style','inline-size'),'Style-driven component variants'],
      ['CSS nesting',CSS.supports('selector','&'),'Readable scoped styles'],
      ['@scope',CSS.supports('selector','@scope'),'Bounded component styling'],
      ['Anchor positioning',CSS.supports('anchor-name','--a'),'Contextual popover placement'],
      ['Popover API',!!HTMLElement.prototype.showPopover,'Light-dismiss capability panel'],
      ['Dialog',!!window.HTMLDialogElement,'Accessible modal workflows'],
      [':has()',CSS.supports('selector','a:has(b)'),'Parent-state styling'],
      ['field-sizing',CSS.supports('width','field-sizing(content)'),'Content-aware form fields'],
      ['Trusted Types',!!window.trustedTypes,'DOM injection policy support'],

      ['Web Animations',!!Element.prototype.animate,'Interactive motion'],

    const root=target||$('#capability-list');if(!root)return;

  }
};
