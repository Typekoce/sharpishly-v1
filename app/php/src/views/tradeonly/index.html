<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vanguard Trade Hub — MVC Trade Portal</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --card: #ffffff;
      --workspace: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #0284c7;
      --accent-dark: #0369a1;
      --warm: #d97706;
      --ok: #16a34a;
      --warn: #ca8a04;
      --err: #dc2626;
      --radius: 8px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--sans); background: var(--workspace); color: var(--text); line-height: 1.45; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

    /* Layout */
    .shell { display: grid; grid-template-columns: 230px 1fr; grid-template-rows: 56px 1fr; min-height: 100vh; }
    .topbar {
      grid-column: 1 / -1; background: var(--bg); color: #f8fafc;
      display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid #334155;
    }
    .brand { font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .search { flex: 1; max-width: 380px; }
    .search input {
      width: 100%; padding: 6px 10px; border-radius: 6px; border: 1px solid #334155;
      background: #1e293b; color: #f8fafc;
    }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .pill-btn {
      padding: 6px 12px; border-radius: 6px; border: 1px solid #334155;
      background: #1e293b; color: #f8fafc; font-size: 0.85rem; font-weight: 500;
    }
    .pill-btn.b2b { border-color: #38bdf8; color: #38bdf8; }
    .pill-btn.b2c { border-color: #fbbf24; color: #fbbf24; }
    .pill-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

    .sidebar { background: var(--surface); color: #cbd5e1; padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; }
    .nav-group { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b; padding: 10px 10px 4px; font-weight: 700; }
    .nav-item {
      display: block; padding: 8px 10px; border-radius: 6px; color: #cbd5e1;
      text-decoration: none; font-size: 0.9rem; font-weight: 500;
    }
    .nav-item:hover { background: #334155; color: #fff; }
    .nav-item.active { background: var(--accent); color: #fff; }

    .main { padding: 24px; max-width: 1440px; width: 100%; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
    .page-title { font-size: 1.4rem; font-weight: 700; }
    .page-sub { font-size: 0.875rem; color: var(--muted); }

    /* Reusable Components */
    .grid-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 18px; }
    .card-head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .card-title { font-size: 0.95rem; font-weight: 600; }
    .card-body { padding: 16px; }
    .kpi { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
    .kpi-lbl { font-size: 0.72rem; text-transform: uppercase; color: var(--muted); letter-spacing: 0.04em; font-weight: 600; }
    .kpi-val { font-size: 1.5rem; font-weight: 700; margin: 4px 0; }
    .kpi-note { font-size: 0.78rem; color: var(--ok); }
    .kpi-note.warn { color: var(--err); }

    .btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: #fff; color: var(--text); font-size: 0.85rem; font-weight: 500; }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-dark); color: #fff; }
    .btn-sm { padding: 4px 8px; font-size: 0.78rem; }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.72rem; font-weight: 600; }
    .b-ok { background: #dcfce7; color: #166534; }
    .b-warn { background: #fef9c3; color: #854d0e; }
    .b-err { background: #fee2e2; color: #991b1b; }
    .b-info { background: #e0f2fe; color: #075985; }

    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th { text-align: left; padding: 10px 12px; background: #f1f5f9; color: var(--muted); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border); }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:hover td { background: #f8fafc; }

    .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
    .prod-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .prod-actions { display: flex; gap: 6px; margin-top: auto; padding-top: 8px; }

    .kanban { display: grid; grid-template-columns: repeat(auto-fit, minmax(195px, 1fr)); gap: 12px; }
    .k-col { background: #f1f5f9; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; }
    .k-head { font-size: 0.82rem; font-weight: 700; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .k-card { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-bottom: 8px; font-size: 0.84rem; }

    .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .tab { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: #fff; font-size: 0.82rem; }
    .tab.active { background: var(--bg); color: #fff; border-color: var(--bg); }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    .field label { font-size: 0.78rem; font-weight: 600; color: var(--muted); }
    .field input, .field select { padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }

    /* Drawer & Dialog */
    .drawer-bg { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none; z-index: 40; }
    .drawer-bg.open { display: block; }
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 95vw); background: #fff;
      border-left: 1px solid var(--border); z-index: 50; display: flex; flex-direction: column;
      transform: translateX(100%); transition: transform .18s ease;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-body { flex: 1; overflow-y: auto; padding: 16px; }
    .drawer-foot { padding: 14px 16px; border-top: 1px solid var(--border); background: #f8fafc; }

    dialog { border: 1px solid var(--border); border-radius: var(--radius); padding: 0; width: min(520px, 94vw); margin: auto; }
    dialog::backdrop { background: rgba(15,23,42,.5); }

    .bar-chart { display: flex; align-items: flex-end; gap: 12px; height: 150px; padding-top: 16px; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
    .bar-pair { display: flex; gap: 4px; align-items: flex-end; width: 100%; justify-content: center; flex: 1; }
    .bar { width: 14px; border-radius: 3px 3px 0 0; }
    .toast {
      position: fixed; bottom: 16px; right: 16px; background: var(--bg); color: #fff;
      padding: 10px 14px; border-radius: 6px; font-size: 0.85rem; z-index: 60; display: none;
    }
    .toast.show { display: block; }

    @media (max-width: 820px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { flex-direction: row; overflow-x: auto; padding: 8px; }
      .nav-group { display: none; }
    }
  </style>
</head>

    // =========================================================================
    // 2. BASE MODEL (Single Persistence & Query Abstraction)
    // =========================================================================
    class BaseModel {
      constructor(collectionKey) {
        this.key = collectionKey;
      }
      all() {
        return App.data[this.key] || [];
      }
      find(id) {
        return this.all().find(item => item.id === id) || null;
      }
      where(predicate) {
        return this.all().filter(predicate);
      }
      search(term) {
        if (!term) return this.all();
        const q = term.toLowerCase();
        return this.all().filter(item =>
          Object.values(item).some(v => String(v).toLowerCase().includes(q))
        );
      }
      insert(record) {
        App.data[this.key].unshift(record);
        App.save();
        return record;
      }
      update(id, patch) {
        const item = this.find(id);
        if (!item) return null;
        Object.assign(item, patch);
        App.save();
        return item;
      }
      remove(id) {
        App.data[this.key] = this.all().filter(item => item.id !== id);
        App.save();
      }
    }

    // Domain Models extending BaseModel
    class ProductModel extends BaseModel {
      constructor() { super('products'); }
      unitPrice(product, qty, mode = App.data.pricingMode) {
        if (mode === 'b2c') return product.retail;
        if (qty >= 250) return product.wholesale[2];
        if (qty >= 50) return product.wholesale[1];
        return product.wholesale[0];
      }
      stockStatus(stock) {
        if (stock <= 0) return { cls: 'b-err', text: 'Out of Stock' };
        if (stock < 300) return { cls: 'b-warn', text: 'Low Stock' };
        return { cls: 'b-ok', text: 'In Stock' };
      }
    }

    class SupplierModel extends BaseModel {
      constructor() { super('suppliers'); }
    }

    class PurchaseOrderModel extends BaseModel {
      constructor() { super('purchaseOrders'); }
      createOrder(supplierName, sku, qty, unitCost) {
        const po = {
          id: 'PO-' + (2400 + this.all().length + 1),
          supplier: supplierName,
          sku,
          qty: Number(qty),
          status: 'Confirmed',
          total: Number(qty) * Number(unitCost),
          eta: '2026-12-12'
        };
        return this.insert(po);
      }
    }

    class DecorationJobModel extends BaseModel {
      constructor() { super('jobs'); }
      static STAGES = ['Artwork Proofing', 'Screen/Plate Setup', 'In Production', 'QC & Packing', 'Ready for Dispatch'];
      advance(id) {
        const job = this.find(id);
        if (!job) return;
        const idx = DecorationJobModel.STAGES.indexOf(job.stage);
        if (idx < DecorationJobModel.STAGES.length - 1) {
          this.update(id, { stage: DecorationJobModel.STAGES[idx + 1] });
        }
      }
      estimateQuote(method, qty, colors) {
        const setupMap = { 'Screen Print': 45, 'Embroidery': 60, 'Laser Engrave': 35, 'DTG': 20 };
        const runMap = { 'Screen Print': 0.85, 'Embroidery': 1.40, 'Laser Engrave': 1.10, 'DTG': 2.25 };
        const setup = (setupMap[method] || 40) * Math.max(1, Number(colors));
        const unitRun = (runMap[method] || 1) + (Math.max(1, Number(colors)) - 1) * 0.35;
        return { setup, unitRun, total: setup + unitRun * Number(qty) };
      }
    }

    class CustomerModel extends BaseModel {
      constructor() { super('customers'); }
      byChannel(channel) { return this.where(c => c.channel === channel); }
    }

    class InvoiceModel extends BaseModel {
      constructor() { super('invoices'); }
      openReceivables() {
        return this.where(i => i.status !== 'Paid').reduce((sum, i) => sum + i.amount, 0);
      }
      toCSV() {
        const lines = ['Invoice,Customer,Amount,Status,Due,Terms'];
        this.all().forEach(i => lines.push(`${i.id},"${i.customer}",${i.amount.toFixed(2)},${i.status},${i.due},${i.terms}`));
        return lines.join('
');
      }
    }

    class CartModel extends BaseModel {
      constructor() { super('cart'); }
      add(sku, qty, deco = null) {
        const existing = this.all().find(i => i.sku === sku && i.deco === deco);
        if (existing) existing.qty += Number(qty);
        else App.data.cart.push({ id: sku + (deco || ''), sku, qty: Number(qty), deco });
        App.save();
      }
      updateQty(index, delta) {
        const item = App.data.cart[index];
        if (!item) return;
        item.qty += delta;
        if (item.qty <= 0) App.data.cart.splice(index, 1);
        App.save();
      }
      clear() {
        App.data.cart = [];
        App.save();
      }
      totalUnits() {
        return this.all().reduce((s, i) => s + i.qty, 0);
      }
    }

    // =========================================================================
    // 3. SHARED VIEW RENDERER (DRY UI Helpers)
    // =========================================================================
    const View = {
      fmt: (n) => new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP' }).format(n),
      el(tag, attrs = {}, children = []) {
        const node = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k === 'class') node.className = v;
          else if (k === 'text') node.textContent = v;
          else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
          else if (v != null) node.setAttribute(k, v);
        }
        [].concat(children).forEach(c => {
          if (c != null) node.append(typeof c === 'string' ? document.createTextNode(c) : c);
        });
        return node;
      },
      pageHeader(title, subtitle, actionBtn = null) {
        return this.el('div', { class: 'page-head' }, [
          this.el('div', {}, [
            this.el('h1', { class: 'page-title', text: title }),
            this.el('div', { class: 'page-sub', text: subtitle })
          ]),
          actionBtn
        ]);
      },
      kpiGrid(items) {
        return this.el('div', { class: 'grid-kpi' }, items.map(k =>
          this.el('div', { class: 'kpi' }, [
            this.el('div', { class: 'kpi-lbl', text: k.label }),
            this.el('div', { class: 'kpi-val mono', text: k.value }),
            this.el('div', { class: 'kpi-note' + (k.warn ? ' warn' : ''), text: k.note || '' })
          ])
        ));
      },
      card(title, bodyNodes, headerAction = null) {
        return this.el('div', { class: 'card' }, [
          this.el('div', { class: 'card-head' }, [
            this.el('span', { class: 'card-title', text: title }),
            headerAction
          ]),
          this.el('div', { class: 'card-body' }, bodyNodes)
        ]);
      },
      table(headers, rows) {
        const tbl = this.el('table', {}, [
          this.el('thead', {}, [this.el('tr', {}, headers.map(h => this.el('th', { text: h })))]),
          this.el('tbody', {}, rows.map(r => this.el('tr', {}, r.map(cell =>
            cell instanceof Node ? this.el('td', {}, [cell]) : this.el('td', { text: String(cell) })
          ))))
        ]);
        return this.el('div', { style: 'overflow-x:auto' }, [tbl]);
      },
      badge(text, cls = 'b-info') {
        return this.el('span', { class: `badge ${cls}`, text });
      },
      toast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove('show'), 2400);
      },
      openModal(title, contentNodes) {
        document.getElementById('modalTitle').textContent = title;
        const body = document.getElementById('modalBody');
        body.replaceChildren(...[].concat(contentNodes));
        document.getElementById('modal').showModal();
      },
      closeModal() {
        document.getElementById('modal').close();
      }
    };

        const costIn = View.el('input', { type: 'number', step: '0.01' });

        const rrpIn = View.el('input', { type: 'number', step: '0.01' });
        const out = View.el('div', { class: 'mono', style: 'font-weight:700;padding:10px;background:#f1f5f9;border-radius:6px' });

        const loadSku = () => {
          const p = this.products.find(prodSel.value);

          costIn.value = p.cost.toFixed(2);
          tradeIn.value = p.wholesale[0].toFixed(2);
          rrpIn.value = p.retail.toFixed(2);
          calc();
        };
        const calc = () => {
          const c = Number(costIn.value) || 0;
          const t = Number(tradeIn.value) || 0;
          const r = Number(rrpIn.value) || 0;
          const tradeMargin = t > 0 ? (((t - c) / t) * 100).toFixed(1) : '0.0';
          const retailMargin = r > 0 ? (((r - c) / r) * 100).toFixed(1) : '0.0';
          out.textContent = `Trade Gross Margin: ${tradeMargin}%  |  B2C Retail Gross Margin: ${retailMargin}%`;
        };
        prodSel.addEventListener('change', loadSku);

            const blob = new Blob([this.invoices.toCSV()], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'vanguard-ar-ledger.csv';
            a.click();
            URL.revokeObjectURL(a.href);
            View.toast('Statement downloaded');
          }
        });

        const invTable = View.table(
          ['Invoice', 'Account', 'Amount', 'Terms', 'Due Date', 'Status', 'Action'],
          list.map(i => {
            const cls = i.status === 'Paid' ? 'b-ok' : (i.status === 'Overdue' ? 'b-err' : 'b-warn');
            return [
              i.id, i.customer, View.fmt(i.amount), i.terms, i.due, View.badge(i.status, cls),
              i.status !== 'Paid'
                ? View.el('button', {
                    class: 'btn btn-sm', type: 'button', text: 'Record Payment',
                    onClick: () => { this.invoices.update(i.id, { status: 'Paid' }); View.toast(`${i.id} settled`); this.refresh(); }
                  })
                : '—'
            ];
          })
        );

        this.render(View.el('div', {}, [
          View.pageHeader('Financials, Credit & Invoicing Ledger', 'Accounts receivable, Net-30/60 terms, and statement export', csvBtn),
          View.kpiGrid([
            { label: 'Settled Revenue', value: View.fmt(settled), note: 'Cleared funds' },
            { label: 'Open Receivables', value: View.fmt(totalAR), note: 'Awaiting settlement' },
            { label: 'Overdue Balance', value: View.fmt(overdue), note: 'Requires credit chase', warn: overdue > 0 }
          ]),
          View.card('Accounts Receivable Ledger', [invTable])
        ]));
      }
    }

    class AccountController extends BaseController {
      index() {
        const resetBtn = View.el('button', {
          class: 'btn', type: 'button', text: 'Reset Seed Data',
          onClick: () => {
            App.reset();
            Chrome.sync();
            View.toast('Demo dataset restored');
            this.refresh();
          }
        });
        const exportBtn = View.el('button', {
          class: 'btn btn-primary', type: 'button', text: 'Export App.data JSON',
          onClick: () => {
            const blob = new Blob([JSON.stringify(App.data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'vanguard-state.json';
            a.click();
            URL.revokeObjectURL(a.href);
          }
        });

        this.render(View.el('div', {}, [
          View.pageHeader('System & Data Controls', 'Inspect or reset client-side state persisted in localStorage'),
          View.card('State Management', [
            View.el('p', { style: 'margin-bottom:12px;color:var(--muted);font-size:0.9rem', text: 'All catalog stock, purchase orders, decoration jobs, trade accounts, and ledger changes persist locally.' }),
            View.el('div', { style: 'display:flex;gap:10px' }, [exportBtn, resetBtn])
          ])
        ]));
      }
    }

    // =========================================================================
    // 6. CART / RFQ DRAWER CONTROLLER
    // =========================================================================
    class CartDrawerController extends BaseController {
      open() {
        document.getElementById('cartDrawer').classList.add('open');
        document.getElementById('drawerBg').classList.add('open');
        this.renderDrawer();
      }
      close() {
        document.getElementById('cartDrawer').classList.remove('open');
        document.getElementById('drawerBg').classList.remove('open');
      }
      renderDrawer() {
        const body = document.getElementById('cartBody');
        const foot = document.getElementById('cartFoot');
        const items = this.cart.all();
        const mode = App.data.pricingMode;

        if (!items.length) {
          body.replaceChildren(View.el('p', { style: 'color:var(--muted);text-align:center;margin-top:40px', text: 'No lines in order or RFQ yet.' }));
          foot.replaceChildren();
          return;
        }

        let subtotal = 0;
        const rows = items.map((line, idx) => {
          const prod = this.products.find(line.sku);
          const unit = prod ? this.products.unitPrice(prod, line.qty, mode) : 0;
          const lineTotal = unit * line.qty;
          subtotal += lineTotal;

          return View.el('div', { style: 'padding:10px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:8px' }, [
            View.el('div', {}, [
              View.el('strong', { text: prod ? prod.name : line.sku }),
              View.el('div', { class: 'mono', style: 'font-size:0.76rem;color:var(--muted)', text: `${line.sku} · ${View.fmt(unit)} ea` }),
              line.deco ? View.el('div', { style: 'font-size:0.75rem;color:var(--accent-dark)', text: line.deco }) : null
            ]),
            View.el('div', { style: 'text-align:right' }, [
              View.el('div', { class: 'mono', style: 'font-weight:700', text: View.fmt(lineTotal) }),
              View.el('div', { style: 'display:flex;gap:4px;justify-content:flex-end;margin-top:4px' }, [
                View.el('button', { class: 'btn btn-sm', type: 'button', text: '−', onClick: () => { this.cart.updateQty(idx, -1); Chrome.sync(); this.renderDrawer(); } }),
                View.el('span', { class: 'mono', style: 'padding:2px 6px', text: String(line.qty) }),
                View.el('button', { class: 'btn btn-sm', type: 'button', text: '+', onClick: () => { this.cart.updateQty(idx, 1); Chrome.sync(); this.renderDrawer(); } })
              ])
            ])
          ]);
        });

        const vat = mode === 'b2b' ? 0 : subtotal * 0.20;
        const grand = subtotal + vat;

        body.replaceChildren(...rows);
        foot.replaceChildren(
          View.el('div', { style: 'display:flex;justify-content:space-between;font-size:0.88rem;margin-bottom:4px' }, [
            View.el('span', { text: 'Subtotal' }), View.el('span', { class: 'mono', text: View.fmt(subtotal) })
          ]),
          View.el('div', { style: 'display:flex;justify-content:space-between;font-size:0.82rem;color:var(--muted);margin-bottom:8px' }, [
            View.el('span', { text: mode === 'b2b' ? 'VAT (Trade Zero/Reverse)' : 'VAT (20% Retail)' }),
            View.el('span', { class: 'mono', text: View.fmt(vat) })
          ]),
          View.el('div', { style: 'display:flex;justify-content:space-between;font-weight:700;margin-bottom:12px' }, [
            View.el('span', { text: 'Total' }), View.el('span', { class: 'mono', text: View.fmt(grand) })
          ]),
          View.el('button', {
            class: 'btn btn-primary', style: 'width:100%', type: 'button',
            text: mode === 'b2b' ? 'Submit Formal Trade RFQ & Invoice' : 'Complete Retail Checkout',
            onClick: () => {
              this.invoices.insert({
                id: 'INV-' + (9100 + this.invoices.all().length + 1),
                customer: mode === 'b2b' ? 'Acme Industrial Supply' : 'Direct Web Buyer',
                amount: grand,
                status: mode === 'b2b' ? 'Net-30 Pending' : 'Paid',
                due: '2026-12-21',
                terms: mode === 'b2b' ? 'Net-30' : 'Card'
              });
              this.cart.clear();
              Chrome.sync();
              this.close();
              View.toast(mode === 'b2b' ? 'Trade RFQ converted to Net-30 invoice' : 'Retail order paid');
              Router.dispatch();
            }
          })
        );
      }
    }

    // =========================================================================
    // 7. ROUTER & APPLICATION BOOTSTRAP
    // =========================================================================
    const Router = {
      routes: {
        overview:      { label: 'Overview',         group: 'Command',      ctrl: new OverviewController() },
        catalog:       { label: 'Product Catalog',  group: 'Command',      ctrl: new CatalogController() },
        suppliers:     { label: 'Suppliers & POs',  group: 'Supply Chain', ctrl: new SuppliersController() },
        decorators:    { label: 'Decorators Queue', group: 'Supply Chain', ctrl: new DecoratorsController() },
        merchandisers: { label: 'Merchandisers',    group: 'Supply Chain', ctrl: new MerchandisersController() },
        customers:     { label: 'Customers',        group: 'Accounts',     ctrl: new CustomersController() },
        financials:    { label: 'Financials',       group: 'Accounts',     ctrl: new FinancialsController() },
        account:       { label: 'System & Data',    group: 'System',       ctrl: new AccountController() }
      },
      current() {
        const key = (location.hash || '#overview').replace('#', '');
        return this.routes[key] ? key : 'overview';
      },
      go(route) {
        location.hash = route;
      },
      dispatch() {
        const key = this.current();
        document.querySelectorAll('.nav-item').forEach(a => a.classList.toggle('active', a.dataset.route === key));
        this.routes[key].ctrl.index();
      }
    };

    const Chrome = {
      drawer: new CartDrawerController(),
      init() {
        const nav = document.getElementById('navMenu');
        let lastGroup = '';
        for (const [key, cfg] of Object.entries(Router.routes)) {
          if (cfg.group !== lastGroup) {
            nav.append(View.el('div', { class: 'nav-group', text: cfg.group }));
            lastGroup = cfg.group;
          }
          nav.append(View.el('a', { href: `#${key}`, class: 'nav-item', 'data-route': key, text: cfg.label }));
        }

        document.getElementById('modeBtn').addEventListener('click', () => {
          App.data.pricingMode = App.data.pricingMode === 'b2b' ? 'b2c' : 'b2b';
          App.save();
          this.sync();
          Router.dispatch();
        });

        document.getElementById('roleSelect').addEventListener('change', (e) => {
          App.data.role = e.target.value;
          App.save();
          Router.dispatch();
        });

        document.getElementById('globalSearch').addEventListener('input', (e) => {
          App.data.search = e.target.value.trim();
          Router.dispatch();
        });

        document.getElementById('cartOpenBtn').addEventListener('click', () => this.drawer.open());
        document.getElementById('cartCloseBtn').addEventListener('click', () => this.drawer.close());
        document.getElementById('drawerBg').addEventListener('click', () => this.drawer.close());
        document.getElementById('modalCloseBtn').addEventListener('click', () => View.closeModal());

        window.addEventListener('hashchange', () => Router.dispatch());
        this.sync();
        Router.dispatch();
      },
      sync() {
        const isB2B = App.data.pricingMode === 'b2b';
        const btn = document.getElementById('modeBtn');
        btn.textContent = isB2B ? 'B2B Trade' : 'B2C Retail';
        btn.className = 'pill-btn ' + (isB2B ? 'b2b' : 'b2c');
        document.getElementById('roleSelect').value = App.data.role;
        document.getElementById('cartBadge').textContent = String(this.drawer.cart.totalUnits());
      }
    };

    App.load();
    Chrome.init();
  </script>
</body>
</html>
