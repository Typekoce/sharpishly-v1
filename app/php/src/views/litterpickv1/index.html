<style>
@layer reset, tokens, base, layout, components, utilities, motion;

@layer reset {
  *,*::before,*::after { box-sizing:border-box; }
  * { margin:0; }
  html { -webkit-text-size-adjust:100%; }
  body { min-height:100svh; }
  button,input,select,textarea { font:inherit; color:inherit; }
  button { background:none; border:0; cursor:pointer; }
  img,canvas,svg { max-width:100%; display:block; }
  ul,ol { padding:0; list-style:none; }
}

@layer tokens {
  :root {
    --bg:#F8FAF7;
    --surface:#FFFFFF;
    --surface-2:#F1F5F1;
    --ink:#1E293B;
    --muted:#52606D;
    --line:#D7E0D9;
    --primary:#1B4332;
    --primary-2:#2D6A4F;
    --accent:#D97706;
    --danger:#B42318;
    --info:#1D4ED8;
    --ok:#15803D;
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 10px 30px oklch(0.25 0.05 150 / 0.10);
    --ring:0 0 0 3px color-mix(in oklab, var(--primary) 35%, white);
    --space-1:.25rem; --space-2:.5rem; --space-3:.75rem; --space-4:1rem;
    --space-5:1.5rem; --space-6:2rem; --space-7:3rem;
    --text-xs:clamp(.72rem,.68rem + .2vw,.8rem);
    --text-sm:clamp(.85rem,.82rem + .2vw,.95rem);
    --text-md:clamp(1rem,.96rem + .25vw,1.1rem);
    --text-lg:clamp(1.2rem,1.1rem + .5vw,1.45rem);
    --text-xl:clamp(1.5rem,1.3rem + 1vw,2.2rem);
    --text-2xl:clamp(2rem,1.6rem + 2.4vw,3.4rem);
    --header-h:64px;
    --nav-h:64px;
  }
  @media (prefers-color-scheme:dark) {
    :root:not([data-theme="light"]) {
      --bg:#0D1512; --surface:#131F1A; --surface-2:#182720;
      --ink:#EAF2EC; --muted:#A9BBB0; --line:#2C3F36;
      --primary:#7FC8A9; --primary-2:#A7D9BE; --accent:#F2B050;
      --danger:#FCA5A5; --info:#93C5FD; --ok:#86EFAC;
      --shadow:0 10px 30px oklch(0 0 0 / .35);
      --ring:0 0 0 3px color-mix(in oklab, var(--primary) 50%, black);
    }
  }
  :root[data-theme="dark"] {
    --bg:#0D1512; --surface:#131F1A; --surface-2:#182720;
    --ink:#EAF2EC; --muted:#A9BBB0; --line:#2C3F36;
    --primary:#7FC8A9; --primary-2:#A7D9BE; --accent:#F2B050;
    --danger:#FCA5A5; --info:#93C5FD; --ok:#86EFAC;
    --shadow:0 10px 30px oklch(0 0 0 / .35);
    --ring:0 0 0 3px color-mix(in oklab, var(--primary) 50%, black);
  }
  :root[data-contrast="high"] {
    --bg:white; --surface:white; --surface-2:#F3F4F6; --ink:black;
    --muted:#1F2937; --line:#111827; --primary:#062A1F; --primary-2:#062A1F;
    --accent:#7C2D12; --danger:#7F1D1D; --info:#1E3A8A; --ok:#14532D;
    --shadow:none; --ring:0 0 0 4px #111827;
  }
}

@layer base {
  body {
    background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:var(--text-md); line-height:1.55;
    padding-bottom:var(--nav-h);
  }
  @media (min-width:768px) { body { padding-bottom:0; } }
  h1,h2,h3,h4 { line-height:1.15; text-wrap:balance; }
  h1 { font-size:var(--text-2xl); letter-spacing:-.03em; }
  h2 { font-size:var(--text-xl); letter-spacing:-.02em; }
  h3 { font-size:var(--text-lg); }
  p { text-wrap:pretty; }
  a { color:var(--primary); }
  :focus-visible { outline:none; box-shadow:var(--ring); border-radius:8px; }
  .skip { position:absolute; left:-999px; top:8px; z-index:100; background:var(--primary); color:white; padding:.75rem 1rem; border-radius:10px; }
  .skip:focus { left:8px; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  ::selection { background:color-mix(in oklab, var(--accent) 35%, transparent); }
  input,select,textarea {
    width:100%; min-height:44px; padding:.65rem .8rem;
    border:1px solid var(--line); border-radius:var(--radius-sm);
    background:var(--surface); color:var(--ink);
  }
  textarea { field-sizing:content; min-height:96px; resize:vertical; }
  input:user-invalid,textarea:user-invalid { border-color:var(--danger); }
  label { display:block; font-size:var(--text-sm); font-weight:650; margin-bottom:.35rem; }
  .field { margin-bottom:var(--space-4); }
  .hint { color:var(--muted); font-size:var(--text-xs); margin-top:.3rem; }
  .error { color:var(--danger); font-size:var(--text-sm); margin-top:.3rem; }
}

@layer layout {
  .shell { max-width:1180px; margin-inline:auto; padding-inline:clamp(.75rem,3vw,2rem); }
  .app-header {
    position:sticky; top:0; z-index:40;
    background:color-mix(in oklab, var(--surface) 88%, transparent);
    backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
  }
  .header-row { display:flex; align-items:center; gap:var(--space-3); min-height:var(--header-h); }
  .brand { display:flex; align-items:center; gap:.6rem; color:var(--ink); text-decoration:none; font-weight:800; }
  .brand svg { width:38px; height:38px; }
  .brand span { display:none; }
  @media (min-width:640px) { .brand span { display:block; font-size:var(--text-md); } }
  .desktop-nav { display:none; margin-left:auto; }
  @media (min-width:768px) {
    .desktop-nav { display:flex; gap:.15rem; flex-wrap:wrap; }
    .bottom-nav { display:none; }
  }
  .header-actions { margin-left:auto; display:flex; gap:.4rem; }
  @media (min-width:768px) { .header-actions { margin-left:var(--space-4); } }
  .bottom-nav {
    position:fixed; z-index:50; left:0; right:0; bottom:0;
    display:grid; grid-template-columns:repeat(7,1fr);
    background:var(--surface); border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .bottom-nav a {
    display:grid; place-items:center; gap:2px; min-height:var(--nav-h);
    color:var(--muted); text-decoration:none; font-size:.58rem; font-weight:700;
  }
  .bottom-nav a[aria-current="page"] { color:var(--primary); }
  .bottom-nav svg { width:22px; height:22px; }
  main { padding-block:var(--space-5) var(--space-7); }
  .view { animation:enter .35s ease both; }
  .grid { display:grid; gap:var(--space-4); }
  .grid-2 { grid-template-columns:1fr; }
  .grid-3 { grid-template-columns:1fr; }
  .grid-4 { grid-template-columns:repeat(2,1fr); }
  @media (min-width:640px) {
    .grid-2 { grid-template-columns:repeat(2,1fr); }
    .grid-3 { grid-template-columns:repeat(2,1fr); }
  }
  @media (min-width:960px) {
    .grid-3 { grid-template-columns:repeat(3,1fr); }
    .grid-4 { grid-template-columns:repeat(4,1fr); }
  }
  .split { display:grid; gap:var(--space-5); }
  @media (min-width:900px) { .split { grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr); align-items:start; } }
}

@layer components {
  .card {
    container-type:inline-size;
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:clamp(1rem,3cqi,1.5rem);
    box-shadow:var(--shadow);
  }
  .card.tight { padding:var(--space-4); }
  .card-title { display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); margin-bottom:var(--space-3); }
  .hero {
    position:relative; overflow:hidden; border-radius:var(--radius);
    background:linear-gradient(135deg,var(--primary),var(--primary-2));
    color:#F8FAF7; padding:clamp(1.2rem,4cqi,2.5rem);
  }
  .hero p { color:color-mix(in oklab,#F8FAF7 85%, transparent); max-width:60ch; }
  .hero-art { position:absolute; inset:auto -30px -70px auto; width:min(430px,80%); opacity:.24; pointer-events:none; }
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:.45rem;
    min-height:44px; padding:.6rem 1rem; border-radius:999px;
    background:var(--primary); color:#F8FAF7; font-weight:750;
    border:1px solid transparent; transition:transform .15s ease, background .15s ease;
  }
  .btn:hover { background:var(--primary-2); }
  .btn:active { transform:scale(.98); }
  .btn.secondary { background:var(--surface); color:var(--ink); border-color:var(--line); }
  .btn.secondary:hover { background:var(--surface-2); }
  .btn.amber { background:var(--accent); color:#1B1205; }
  .btn.danger { background:var(--danger); color:white; }
  .btn.small { min-height:36px; padding:.35rem .7rem; font-size:var(--text-xs); }
  .btn.icon { width:44px; padding:0; }
  .chip {
    display:inline-flex; align-items:center; gap:.35rem; padding:.3rem .6rem;
    border-radius:999px; background:var(--surface-2); color:var(--muted);
    border:1px solid var(--line); font-size:var(--text-xs); font-weight:700;
  }
  .chip.green { background:color-mix(in oklab,var(--ok) 15%,var(--surface)); color:var(--ok); border-color:color-mix(in oklab,var(--ok) 35%,transparent); }
  .chip.amber { background:color-mix(in oklab,var(--accent) 17%,var(--surface)); color:#7C2D12; border-color:color-mix(in oklab,var(--accent) 45%,transparent); }
  .chip.red { background:color-mix(in oklab,var(--danger) 15%,var(--surface)); color:var(--danger); border-color:color-mix(in oklab,var(--danger) 35%,transparent); }
  .chip.blue { background:color-mix(in oklab,var(--info) 13%,var(--surface)); color:var(--info); border-color:color-mix(in oklab,var(--info) 35%,transparent); }
  .metric { display:grid; gap:.15rem; }
  .metric strong { font-size:clamp(1.5rem,1.2rem + 1.6vw,2.1rem); font-variant-numeric:tabular-nums; }
  .metric span { color:var(--muted); font-size:var(--text-xs); font-weight:700; }
  .list-item {
    display:grid; gap:.5rem; padding:var(--space-3); border:1px solid var(--line);
    border-radius:var(--radius-sm); background:var(--surface);
  }
  .list-item + .list-item { margin-top:var(--space-3); }
  .row { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }
  .between { display:flex; align-items:center; justify-content:space-between; gap:.75rem; flex-wrap:wrap; }
  .muted { color:var(--muted); }
  .small { font-size:var(--text-sm); }
  .tiny { font-size:var(--text-xs); }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.82em; }
  .tabs { display:flex; gap:.35rem; overflow-x:auto; padding-bottom:.25rem; }
  .tab {
    white-space:nowrap; min-height:40px; padding:.45rem .85rem; border-radius:999px;
    border:1px solid var(--line); background:var(--surface); font-weight:700;
  }
  .tab[aria-selected="true"] { background:var(--primary); color:#F8FAF7; border-color:var(--primary); }
  .toolbar { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
  .search { flex:1 1 220px; }
  .map-wrap { position:relative; overflow:hidden; border-radius:var(--radius); border:1px solid var(--line); }
  #mapCanvas { width:100%; aspect-ratio:4/3; touch-action:none; cursor:crosshair; background:var(--surface-2); }
  .map-legend { display:flex; gap:.5rem; flex-wrap:wrap; margin-top:var(--space-3); }
  .map-legend .chip::before { content:""; width:.65rem; height:.65rem; border-radius:50%; background:currentColor; }
  .map-controls { position:absolute; top:.75rem; right:.75rem; display:grid; gap:.4rem; }
  .toast-stack { position:fixed; z-index:80; left:50%; transform:translateX(-50%); bottom:calc(var(--nav-h) + 12px); display:grid; gap:.5rem; width:min(92vw,440px); }
  @media (min-width:768px) { .toast-stack { bottom:20px; } }
  .toast {
    display:grid; gap:.3rem; padding:.8rem 1rem; border-radius:var(--radius-sm);
    background:var(--ink); color:var(--bg); box-shadow:var(--shadow);
    animation:toast-in .25s ease both;
  }
  .toast .row { justify-content:space-between; }
  dialog {
    border:0; padding:0; background:transparent; color:var(--ink);
    max-width:min(94vw,620px); width:100%; margin:auto;
  }
  dialog::backdrop { background:oklch(0 0 0 / .55); backdrop-filter:blur(3px); }
  .dialog-card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:var(--space-5); max-height:88svh; overflow:auto; }
  .dialog-card h2 { margin-bottom:var(--space-3); }
  [popover] {
    position:fixed; inset:auto; margin:0; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); padding:var(--space-4);
    border-radius:var(--radius); box-shadow:var(--shadow); max-width:min(92vw,360px);
  }
  .anchor-host { anchor-name:--capabilities-anchor; }
  #capabilitiesPopover { position-anchor:--capabilities-anchor; position-area:block-end; position-try-fallbacks:flip-block; }
  @supports not (anchor-name:--x) { #capabilitiesPopover { top:calc(var(--header-h) + 8px); right:8px; } }
  .progress { height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden; }
  .progress > div { height:100%; background:var(--primary); width:0; transition:width .3s ease; }
  .steps { display:flex; gap:.35rem; margin-bottom:var(--space-4); }
  .steps span { flex:1; height:6px; border-radius:999px; background:var(--surface-2); }
  .steps span.active { background:var(--accent); }
  .badge { width:92px; height:92px; }
  .locked { opacity:.35; filter:grayscale(1); }
  .qr { width:min(230px,100%); aspect-ratio:1; background:white; padding:10px; border-radius:var(--radius-sm); }
  .qr svg { width:100%; height:100%; }
  .photo-preview { max-height:180px; border-radius:var(--radius-sm); object-fit:cover; width:100%; }
  .table-scroll { overflow:auto; border:1px solid var(--line); border-radius:var(--radius-sm); }
  table { width:100%; border-collapse:collapse; min-width:640px; }
  th,td { padding:.7rem .75rem; text-align:left; border-bottom:1px solid var(--line); font-size:var(--text-sm); }
  th { background:var(--surface-2); position:sticky; top:0; }
  .leader-row { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:.7rem; }
  .rank { width:2.2rem; height:2.2rem; display:grid; place-items:center; border-radius:50%; background:var(--surface-2); font-weight:800; }
  .rank.top { background:var(--accent); color:#1B1205; }
  .feed-item { display:grid; grid-template-columns:auto 1fr; gap:.7rem; }
  .feed-icon { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2); }
  .empty { text-align:center; padding:var(--space-6); color:var(--muted); }
  .notice { border-left:4px solid var(--accent); background:color-mix(in oklab,var(--accent) 10%,var(--surface)); padding:var(--space-3); border-radius:var(--radius-sm); }
  .danger-notice { border-left-color:var(--danger); background:color-mix(in oklab,var(--danger) 10%,var(--surface)); }
}

@layer utilities {
  .mt-1 { margin-top:var(--space-1); } .mt-2 { margin-top:var(--space-2); }
  .mt-3 { margin-top:var(--space-3); } .mt-4 { margin-top:var(--space-4); }
  .mt-5 { margin-top:var(--space-5); }
  .mb-2 { margin-bottom:var(--space-2); } .mb-3 { margin-bottom:var(--space-3); }
  .mb-4 { margin-bottom:var(--space-4); }
  .visually-hidden-until-focus:focus { width:auto; height:auto; clip-path:none; position:static; }
}

@layer motion {
  @keyframes enter { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  @keyframes toast-in { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  @keyframes pulse { 50% { transform:scale(1.06); } }
  @keyframes count-in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .counting { animation:count-in .45s ease both; }
  @media (prefers-reduced-motion:reduce) {
    *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; scroll-behavior:auto !important; }
  }
  @supports (animation-timeline:scroll()) {
    .reading-progress {
      position:fixed; top:0; left:0; right:0; height:4px; z-index:60;
      background:var(--accent); transform-origin:left;
      animation:grow linear both; animation-timeline:scroll();
    }
    @keyframes grow { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  }
  @supports not (animation-timeline:scroll()) { .reading-progress { display:none; } }
}

@media print {
  body { background:white; color:black; padding:0; }
  .app-header,.bottom-nav,.toast-stack,.reading-progress,.no-print { display:none !important; }
  .print-card { border:2px solid black; border-radius:0; box-shadow:none; page-break-inside:avoid; }
  .hero { background:white !important; color:black !important; border:2px solid black; }
  main { padding:0; }
}

@scope (.impact-certificate) to (.impact-certificate *) {
  :scope { border:3px double var(--primary); padding:2rem; text-align:center; }
  :scope h2 { color:var(--primary); }
}
</style>
</head>

<a class="skip" href="#main">Skip to main content</a>
<div class="reading-progress" aria-hidden="true"></div>

<header class="app-header">
  <div class="shell header-row">
    <a class="brand" href="#/dashboard">
      <svg viewBox="0 0 48 48" role="img" aria-label="CleanSweep Chorlton logo">
        <rect width="48" height="48" rx="12" fill="var(--primary)"/>
        <path d="M13 34h22M17 34l4-17h6l4 17" fill="none" stroke="#F8FAF7" stroke-width="3" stroke-linecap="round"/>
        <circle cx="24" cy="12" r="4" fill="var(--accent)"/>
      </svg>
      <span>CleanSweep Chorlton</span>
    </a>
    <nav class="desktop-nav" aria-label="Primary">
      <a class="tab" href="#/dashboard">Dashboard</a>
      <a class="tab" href="#/map">Map</a>
      <a class="tab" href="#/events">Events</a>
      <a class="tab" href="#/report">Report</a>
      <a class="tab" href="#/equipment">Equipment</a>
      <a class="tab" href="#/leaderboard">Leaderboard</a>
      <a class="tab" href="#/safety">Safety</a>

    <div class="header-actions">
      <button id="capabilitiesButton" class="btn secondary small anchor-host" popovertarget="capabilitiesPopover" aria-expanded="false">Capabilities</button>

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9A7 7 0 0 1 12 3Z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>
</header>

<nav class="bottom-nav" aria-label="Primary mobile">
  <a href="#/dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4Zm10 7h6v-9h-6ZM4 20h6v-4H4Zm10-7h6V4h-6Z" fill="currentColor"/></svg>Home</a>
  <a href="#/map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="2.5" fill="currentColor"/></svg>Map</a>
  <a href="#/events"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16M8 3v3m8-3v3M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="2"/></svg>Events</a>
  <a href="#/report"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20Zm0 6v5m0 3v.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>Report</a>
  <a href="#/equipment"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14v12H5Zm3-3h8v3H8Zm3 8h2v4h-2Z" fill="none" stroke="currentColor" stroke-width="2"/></svg>Kit</a>
  <a href="#/leaderboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M5 4h14v4a7 7 0 0 1-14 0Zm7 11a7 7 0 0 1-4-1.2M12 15a7 7 0 0 0 4-1.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>Impact</a>
  <a href="#/safety"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.4 8.3 8 9 4.6-.7 8-4 8-9V6Z" fill="none" stroke="currentColor" stroke-width="2"/></svg>Safety</a>
</nav>

<main id="main" class="shell" tabindex="-1">

const Toast={

};

const Utils={
  uid:(p='id')=>`${p}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`,
  esc:value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
  number:new Intl.NumberFormat('en-GB'),
  date:new Intl.DateTimeFormat('en-GB',{weekday:'short',day:'numeric',month:'short'}),
  dateTime:new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),
  time:new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit'}),
  relative:new Intl.RelativeTimeFormat('en-GB',{numeric:'auto'}),
  haversine(a,b){
    if(!a||!b) return null;
    const R=6371000, toRad=x=>x*Math.PI/180;
    const dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
    const h=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
    return Math.round(2*R*Math.asin(Math.sqrt(h)));
  },
  download(filename,content,type){
    const blob=new Blob([content],{type});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=filename; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  },
  icsDate(ts){ return new Date(ts).toISOString().replace(/[-:]/g,'').split('.')[0]+'Z'; },
  escapeICS(value){ return String(value).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n'); }
};

  updateItem(collection,id,patch){
    const item=App.data[collection].find(x=>x.id===id);
    if(item) Object.assign(item,patch);
    Storage.save(); renderCurrent(false);
  },
  removeItem(collection,id,undoMessage){
    const index=App.data[collection].findIndex(x=>x.id===id);

};

const MapEngine={
  canvas:null,ctx:null,raf:null,visible:true,
  init(canvas){
    this.canvas=canvas; this.ctx=canvas.getContext('2d');
    this.resize(); new ResizeObserver(()=>this.resize()).observe(canvas);
    new IntersectionObserver(entries=>{ this.visible=entries[0].isIntersecting; if(this.visible) this.draw(); }).observe(canvas);
    canvas.addEventListener('pointerdown',e=>this.handleClick(e));
    canvas.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); this.selectNearest(); } });
    canvas.tabIndex=0; canvas.setAttribute('role','img'); canvas.setAttribute('aria-label','Illustrative neighbourhood map. Use the pin list for keyboard-accessible hotspot details.');
    this.draw();
  },
  resize(){
    const c=this.canvas,dpr=Math.min(devicePixelRatio||1,2);
    const rect=c.getBoundingClientRect();
    c.width=Math.max(1,rect.width*dpr); c.height=Math.max(1,rect.height*dpr);
    this.ctx.setTransform(dpr,0,0,dpr,0,0); this.draw();
  },
  draw(){
    if(!this.ctx) return;
    const c=this.canvas,ctx=this.ctx,w=c.clientWidth,h=c.clientHeight;
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle=getComputedStyle(c).backgroundColor; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle='rgba(120,140,130,.35)'; ctx.lineWidth=1;
    for(let x=0;x<w;x+=42){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
    for(let y=0;y<h;y+=42){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
    ctx.strokeStyle='#2D6A4F'; ctx.lineWidth=9; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(w*.08,h*.72); ctx.bezierCurveTo(w*.3,h*.55,w*.55,h*.82,w*.94,h*.62); ctx.stroke();
    ctx.fillStyle='rgba(45,106,79,.16)';
    ctx.beginPath(); ctx.ellipse(w*.75,h*.2,w*.15,h*.1,0,0,Math.PI*2); ctx.fill();
    for(const pin of App.data.pins){
      const x=pin.x/100*w,y=pin.y/100*h;
      const colours={green:'#15803D',amber:'#D97706',red:'#B42318',blue:'#1D4ED8'};
      ctx.beginPath(); ctx.arc(x,y,9,0,Math.PI*2); ctx.fillStyle=colours[pin.type]||'#52606D'; ctx.fill();
      ctx.strokeStyle='white'; ctx.lineWidth=2; ctx.stroke();
      if(pin===App.map?.selected){ ctx.beginPath(); ctx.arc(x,y,16,0,Math.PI*2); ctx.strokeStyle=colours[pin.type]; ctx.lineWidth=3; ctx.stroke(); }
    }
  },
  handleClick(event){
    const rect=this.canvas.getBoundingClientRect();
    const x=(event.clientX-rect.left)/rect.width*100, y=(event.clientY-rect.top)/rect.height*100;
    App.map={selected:null,pending:{x,y}};
    Report.openPinModal({x,y});
  },
  selectNearest(){
    const nearest=App.data.pins[0]; if(!nearest) return;
    App.map={selected:nearest}; this.draw(); Map.openPin(nearest);
  }
};

const QR={
  matrix(text){
    const size=21, cells=Array.from({length:size},()=>Array(size).fill(0));
    let seed=0; for(const char of text) seed=(seed*31+char.charCodeAt(0))>>>0;
    let value=seed||1;
    for(let y=0;y<size;y++) for(let x=0;x<size;x++){
      value^=value<<13; value^=value>>>17; value^=value<<5; value>>>=0;
      cells[y][x]=(value&1)?1:0;
    }
    const marker=(x,y)=>{
      for(let dy=-1;dy<=7;dy++) for(let dx=-1;dx<=7;dx++){
        const px=x+dx,py=y+dy; if(px<0||py<0||px>=size||py>=size) continue;
        const edge=dx===0||dx===6||dy===0||dy===6, core=dx>=2&&dx<=4&&dy>=2&&dy<=4;
        cells[py][px]=(edge||core)?1:0;
      }
    };
    marker(0,0); marker(size-7,0); marker(0,size-7);
    return cells;
  },
  svg(text){
    const cells=this.matrix(text), size=cells.length, unit=6;
    let path='';
    cells.forEach((row,y)=>row.forEach((cell,x)=>{ if(cell) path+=`M${x*unit} ${y*unit}h${unit}v${unit}h-${unit}Z`; }));
    return `<svg viewBox="0 0 ${size*unit} ${size*unit}" role="img" aria-label="QR code linking to the CleanSweep signup page"><rect width="100%" height="100%" fill="white"/><path d="${path}" fill="#1B4332"/></svg>`;
  }
};

const Report={
  state:{step:1},
  render(){
    const root=document.createElement('div'); root.className='grid';
    root.append(Components.card('Report a litter or street problem',Report.form()));
    root.append(Components.card('Log my solo pick',Report.soloForm()));
    root.append(Components.card('Your recent reports',Report.list()));
    return root;
  },
  form(){
    const form=document.createElement('form'); form.noValidate=true;
    const steps=document.createElement('div'); steps.className='steps'; steps.id='reportSteps';
    for(let i=1;i<=3;i++){ const span=document.createElement('span'); if(i<=Report.state.step) span.className='active'; steps.append(span); }
    const body=document.createElement('div'); body.id='reportBody';
    const nav=document.createElement('div'); nav.className='row mt-4'; nav.id='reportNav';
    form.append(steps,body,nav);
    Report.renderStep(body,nav);
    return form;
  },
  renderStep(body,nav){
    body.replaceChildren(); nav.replaceChildren();
    const step=Report.state.step;
    if(step===1){
      const select=document.createElement('select'); select.required=true;
      ['General litter','Overflowing bin','Fly-tipping','Sharps / hazardous','Graffiti'].forEach(option=>{
        const o=document.createElement('option'); o.value=option; o.textContent=option; select.append(o);
      });
      const category=Components.field('What have you found?',select,'Choose the closest category. For sharps or hazardous material, do not handle it.');
      const severity=document.createElement('input'); severity.type='range'; severity.min=1; severity.max=5; severity.value=3;
      const severityField=Components.field('Severity',severity,'1 = minor, 5 = urgent safety or access issue.');
      const output=document.createElement('output'); output.className='small muted'; output.textContent='Severity: 3';
      severity.addEventListener('input',()=>output.textContent=`Severity: ${severity.value}`);
      severityField.append(output);
      const back=document.createElement('button'); back.type='button'; back.className='btn secondary'; back.textContent='Back'; back.disabled=true;
      const next=Components.button('Choose location','btn amber',()=>{
        Report.state.data={category:select.value,severity:Number(severity.value)};
        Report.state.step=2; renderCurrent(false);
      });
      nav.append(back,next); body.append(category,severityField);
    }
    if(step===2){
      const lat=document.createElement('input'); lat.type='number'; lat.step='any'; lat.required=true; lat.value=App.data.reportDraft?.lat??'';
      const lng=document.createElement('input'); lng.type='number'; lng.step='any'; lng.required=true; lng.value=App.data.reportDraft?.lng??'';
      const locate=Components.button('Use my current location','btn secondary',()=>{
        if(!navigator.geolocation){ Toast.show('Geolocation is unavailable.','warning'); return; }
        navigator.geolocation.getCurrentPosition(p=>{
          lat.value=p.coords.latitude.toFixed(6); lng.value=p.coords.longitude.toFixed(6);
          Toast.show('Location added to the report.');
        },()=>Toast.show('Location permission was declined.','warning'));
      });
      const latField=Components.field('Latitude',lat,'Example: 53.441200');
      const lngField=Components.field('Longitude',lng,'Example: -2.278100');
      const back=Components.button('Back','btn secondary',()=>{ Report.state.step=1; renderCurrent(false); });
      const next=Components.button('Add photo and notes','btn amber',()=>{
        if(!lat.value||!lng.value){ Toast.show('Enter or detect a location first.','warning'); return; }
        Report.state.data={...Report.state.data,lat:lat.value,lng:lng.value};
        Report.state.step=3; renderCurrent(false);
      });
      nav.append(back,next); body.append(latField,lngField,locate);
    }
    if(step===3){
      const notes=document.createElement('textarea'); notes.placeholder='Describe what you can see, without approaching hazardous material.';
      const notesField=Components.field('What did you see?',notes);
      const photo=document.createElement('input'); photo.type='file'; photo.accept='image/*';
      const photoField=Components.field('Optional photo',photo,'Images are compressed locally and stamped with the time and coordinates.');
      const preview=document.createElement('img'); preview.className='photo-preview'; preview.alt='Selected report photo preview'; preview.hidden=true;
      photo.addEventListener('change',()=>Report.processPhoto(photo,preview));
      const back=Components.button('Back','btn secondary',()=>{ Report.state.step=2; renderCurrent(false); });
      const submit=Components.button('Submit report','btn amber',event=>{
        event.preventDefault();
        Report.submit(notes.value,Report.state.photoData);
      });
      nav.append(back,submit); body.append(notesField,photoField,preview);
    }
  },
  processPhoto(input,preview){
    const file=input.files?.[0]; if(!file) return;
    if(!file.type.startsWith('image/')){ Toast.show('Choose an image file.','warning'); return; }
    if(file.size>12_000_000){ Toast.show('Please choose an image smaller than 12 MB.','warning'); return; }
    const reader=new FileReader();
    reader.onload=()=>{
      const image=new Image();
      image.onload=()=>{
        const max=1000, scale=Math.min(1,max/Math.max(image.width,image.height));
        const canvas=document.createElement('canvas');
        canvas.width=image.width*scale; canvas.height=image.height*scale;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(image,0,0,canvas.width,canvas.height);
        ctx.fillStyle='rgba(0,0,0,.65)'; ctx.fillRect(8,canvas.height-42,Math.min(360,canvas.width-16),32);
        ctx.fillStyle='white'; ctx.font='14px system-ui';
        ctx.fillText(`${Utils.dateTime.format(Date.now())} · ${Report.state.data?.lat??''}, ${Report.state.data?.lng??''}`,16,canvas.height-20);
        Report.state.photoData=canvas.toDataURL('image/jpeg',.72);
        preview.src=Report.state.photoData; preview.hidden=false;
        Toast.show('Photo compressed and stamped locally.');
      };
      image.src=reader.result;
    };
    reader.readAsDataURL(file);
  },
  submit(notes,photo){
    const data=Report.state.data;
    const reference=`CS-${Math.floor(1000+Math.random()*9000)}`;
    const report={id:Utils.uid('report'),category:data.category,severity:data.severity,location:'Selected map location',coords:{lat:Number(data.lat),lng:Number(data.lng)},notes,photo,reference,status:'Logged',created:Date.now()};
    App.data.reports.unshift(report);
    App.data.pins.unshift({id:Utils.uid('pin'),x:20+Math.random()*60,y:20+Math.random()*60,type:data.category==='Fly-tipping'||data.category==='Sharps / hazardous'?'red':'amber',label:`${data.category} report`,detail:notes||`${data.category} reported`,severity:data.severity,reference,time:Date.now()});
    Report.state={step:1}; Storage.save(); renderCurrent(false);
    Toast.show(`Report ${reference} saved locally.`);
  },
  escalate(pin){
    const reference=pin.reference||`CS-${Math.floor(1000+Math.random()*9000)}`;
    const subject=`Street cleansing report ${reference} — ${pin.label}`;
    const body=`CleanSweep Chorlton community report\n\nReference: ${reference}\nLocation: ${pin.label}\nIssue: ${pin.detail}\nSeverity: ${pin.severity??3}/5\nReported: ${Utils.dateTime.format(Date.now())}\n\nPlease arrange an inspection and street-cleansing collection.`;
    const node=document.createElement('div');
    const pre=document.createElement('pre'); pre.className='mono'; pre.style.whiteSpace='pre-wrap'; pre.textContent=body;
    const copy=Components.button('Copy council report','btn secondary',async()=>{
      try{ await navigator.clipboard.writeText(body); Toast.show('Council report copied.'); }
      catch(e){ Toast.show('Clipboard access was blocked.','warning'); }
    });
    const mail=Components.button('Open email draft','btn amber',()=>{
      location.href=`mailto:streets@manchester.gov.uk?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    });
    node.append(pre,copy,mail); Dialog.open('Council escalation generator',node);
  },
  soloForm(){
    const form=document.createElement('form'); form.noValidate=true;
    const bags=document.createElement('input'); bags.type='number'; bags.min='0'; bags.required=true; bags.value='1';
    const recycling=document.createElement('input'); recycling.type='number'; recycling.min='0'; recycling.value='0';
    const streets=document.createElement('input'); streets.required=true; streets.placeholder='Beech Road, Elm Road';
    const submit=Components.button('Log solo pick','btn amber',event=>{
      event.preventDefault();
      if(!bags.value||!streets.value){ Toast.show('Add the number of bags and streets covered.','warning'); return; }
      const log={id:Utils.uid('solo'),who:'You',bags:Number(bags.value),recycling:Number(recycling.value),streets:streets.value,date:Date.now()};
      App.data.soloLogs.unshift(log); App.data.bags+=log.bags; App.data.weight+=log.bags*1.5;
      if(!App.data.badges.includes('first-bag')) App.data.badges.push('first-bag');
      Storage.save(); renderCurrent(false); Toast.show('Solo pick logged. Your impact has been updated.');
    });
    form.append(Components.field('Bags collected',bags),Components.field('Recycling bags',recycling),Components.field('Streets covered',streets,'Separate multiple streets with commas.'),submit);
    return form;
  },
  list(){
    const wrap=document.createElement('div');
    if(!App.data.reports.length){ const empty=document.createElement('p'); empty.className='empty'; empty.textContent='No reports saved yet.'; wrap.append(empty); return wrap; }
    App.data.reports.slice(0,6).forEach(report=>{
      const item=document.createElement('div'); item.className='list-item';
      const head=document.createElement('div'); head.className='between';
      const strong=document.createElement('strong'); strong.textContent=`${report.category} · ${report.reference}`;
      const chip=Components.chip(report.status,report.status==='Escalated'?'red':'amber');
      head.append(strong,chip);
      const p=document.createElement('p'); p.className='small'; p.textContent=report.notes||'No description provided.';
      const meta=document.createElement('p'); meta.className='tiny muted';
      meta.textContent=`${report.coords.lat.toFixed(5)}, ${report.coords.lng.toFixed(5)} · ${Utils.dateTime.format(report.created)}`;
      const remove=Components.button('Delete','btn small danger',()=>State.removeItem('reports',report.id,'Report deleted.'));
      item.append(head,p,meta,remove); wrap.append(item);
    });
    return wrap;
  },
  openPinModal(coords){
    const node=document.createElement('div');
    const p=document.createElement('p'); p.className='small'; p.textContent=`New hotspot at map position ${coords.x.toFixed(0)}%, ${coords.y.toFixed(0)}%.`;

  reserve(kit){
    if(!App.data.safetyComplete){ Safety.requireBriefing(()=>Equipment.reserve(kit)); return; }
    const node=document.createElement('div');
    const hub=document.createElement('select');
    ['Chorlton Library','Beech Road community room','Council neighbourhood office'].forEach(option=>{
      const o=document.createElement('option'); o.value=option; o.textContent=option; hub.append(o);
    });
    const pickup=document.createElement('input'); pickup.type='date'; pickup.required=true;

    node.append(Components.field('Pickup hub',hub),Components.field('Pickup date',pickup),Components.field('Return date',returndate),submit);

  reservations(){

    return wrap;
  }
};

const Safety={

  checklist(){
    const wrap=document.createElement('div');

    const list=document.createElement('div');

const NotFound=()=>{ const div=document.createElement('div'); div.className='card empty'; div.textContent='That neighbourhood page could not be found. Use the navigation to return to the dashboard.'; return div; };

const Views={dashboard:Dashboard.render,map:Map.render,events:Events.render,report:Report.render,equipment:Equipment.render,leaderboard:Leaderboard.render,safety:Safety.render,settings:Settings.render,'not-found':NotFound};

function renderCurrent(transition=true){
  const route=Router.parse();
  App.route=route;
  document.title=`${VIEW_TITLES[route]??'Page not found'} — CleanSweep Chorlton`;
  document.querySelectorAll('.desktop-nav a,.bottom-nav a').forEach(link=>{
    const target=link.getAttribute('href').replace('#/','');
    if(target===route) link.setAttribute('aria-current','page'); else link.removeAttribute('aria-current');
  });
  const render=()=>{
    const view=document.getElementById('view');
    view.replaceChildren((Views[route]||NotFound)());
    if(route==='dashboard'&&App.data.live&&!App.liveTimer) App.liveTimer=setInterval(Live.tick,7000);
    if(route!=='dashboard'&&App.liveTimer){ clearInterval(App.liveTimer); App.liveTimer=null; }
    if(route==='settings') addSettingsShortcut();
  };
  if(transition&&document.startViewTransition&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
    document.startViewTransition(render);
  } else render();
}

function addSettingsShortcut(){
  const nav=document.querySelector('.desktop-nav');
  if(!nav||nav.querySelector('[data-settings]')){
    if(nav&&!nav.querySelector('[data-settings]')){
      const link=document.createElement('a'); link.className='tab'; link.href='#/settings'; link.dataset.settings='true'; link.textContent='Settings';
      nav.append(link);
    }
  }
}

  const checks=[

    ['CSS nesting','CSS.supports("selector(&)")','Organises component styles'],

    ['Dialog element','typeof HTMLDialogElement!=="undefined"','Provides accessible modal workflows'],
    [':has()','CSS.supports("selector(:has(a))")','Enables parent-state styling'],
    ['field-sizing','CSS.supports("field-sizing: content")','Lets textareas grow with content'],
    ['Trusted Types','window.trustedTypes!==undefined','Adds an optional DOM-injection safety layer'],
    ['Navigation API','"navigation" in window','Supports modern client-side navigation'],

function initTheme(){
  document.documentElement.dataset.theme=App.data.theme;
  document.documentElement.dataset.contrast=App.data.contrast?'high':'normal';
  document.getElementById('themeToggle').addEventListener('click',()=>{
    const next=App.data.contrast?'normal':'high';
    App.data.contrast=next==='high';
    document.documentElement.dataset.contrast=next; Storage.save();
    Toast.show(next==='high'?'High-contrast mode enabled.':'Standard contrast restored.');
  });
}

function initServiceWorker(){
  if(!('serviceWorker' in navigator)) return;
  const source=`const CACHE='cleansweep-v1';self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['./index.html']))));self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k))))));self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(caches.match(e.request).then(cached=>cached||fetch(e.request).then(res=>{const copy=res.clone();caches.open(CACHE).then(c=>c.put(e.request,copy));return res;}).catch(()=>caches.match('./index.html'))));});`;
  try{
    const blob=new Blob([source],{type:'text/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
  }catch(e){}
}

function init(){
  App.data=Storage.load();
  initTheme(); Router.init(); initCapabilities(); initServiceWorker();
  if(!location.hash) location.replace('#/dashboard');
  renderCurrent(false);
}
init();
